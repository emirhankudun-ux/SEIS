schema_version: 2

project:
  id: seis-plugin-root
  display_name: SEIS Core App-Owned Plugins
  symbolic_name: SEIS
  aliases:
    - seis-core-plugins
  kind: application-plugin-root
  lifecycle: active
  visibility: public-repo-internal-local
  horizon: 5-years

ecosystem:
  role:
    - app-owned-plugin-source
    - command-center-extension
    - ai-core-consumer
  related_projects:
    - seis
    - pantechnoesis
  canonical_owner_repo: SEIS

plugin_boundary:
  application: apps/seis-core
  source_root: plugins/seis-core
  release_train: content/development/seis-core-plugin-release-train.json
  marketplace_mutation: false
  public_suite_release_track: plugins/seis-ai-agent
  direct_repo_distribution:
    enabled: true
    public_repository_available: true
    public_audience: everyone
    distribution_scope: direct-repository-source
    marketplace_name: seis-repo
    public_marketplace: true
    source_manifest: apps/seis-core/data/seis-core-plugin-sources.json
    catalog: apps/seis-core/data/seis-core-plugin-catalog.json
    unified_suite: plugins/seis-ai-agent/assets/unified-suite.json
    marketplace_projection:
      card_count: 34
      canonical_card_count: 1
      bundle_card_count: 33
      application_bundle_card_count: 6
      topic_bundle_card_count: 27
    source_capabilities:
      retained_count: 380
      migrated_root_count: 5
      application_count: 75
      topic_count: 300
    bundle_catalog: content/development/seis-public-plugin-bundle-catalog.json
    topic_source_root: plugins/seis-topics
    topic_objective_source: content/development/seis-topic-plugin-objective.json
    separate_marketplace_cards: false
    source_packages_retained: true
    core_source_owner: false
    future_plugin_path: plugins/seis-core/<plugin-name>

platforms:
  primary:
    - repository
    - cli
  planned:
    - macos
    - ipados
    - ios

architecture:
  mode: modular-monolith
  shared_packages:
    - packages/seis-ai
  source_of_truth: plugins/seis-core

security:
  secrets_policy: local-or-managed-only
  public_repo: true
  default_plugin_permissions:
    write: []
    network: []
    secrets: []

commands:
  install: null
  lint: null
  test: "npm test --prefix packages/seis-ai"
  build: null
  validate: "npm run check:seis-core-plugin-release"
