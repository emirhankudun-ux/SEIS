pending_decisions:
  - id: seis-manifest-publication
    description: Complete review of the SEIS project manifest in its canonical public repository.
    reason: A public manifest review has an exact commit, open pull-request, and successful CI observation, but the pull request remains open and project.ecosystem.yaml is absent from the observed canonical main revision.
    unblock_condition: Complete human review, merge through repository policy, refresh the observed main revision, and promote status from review to validated.
  - id: eleni-manifest-publication
    description: Add and validate the Eleni-Neferi project manifest in its canonical private repository.
    reason: A private-accurate manifest has passing repository-local commit, draft pull-request, and CI evidence, but the pull request is open and project.ecosystem.yaml is absent from the observed canonical main revision.
    unblock_condition: Complete human review, merge the manifest through repository policy, refresh the observed main revision, and promote status from review to validated.
  - id: pantechno-manifest-publication
    description: Add and validate the Pantechnoesis project manifest in its canonical private repository.
    reason: A private-accurate manifest has passing repository-local commit, draft pull-request, and CI evidence, but the pull request is open and project.ecosystem.yaml is absent from the observed canonical main revision.
    unblock_condition: Complete human review, merge the manifest through repository policy, refresh the observed main revision, and promote status from review to validated.
  - id: shared-module-inventory
    description: Complete the cross-repository shared-module and consumer mapping inventory.
    reason: The audited module paths now have an exact non-overlapping proposed inventory, but consumer mappings remain planned and ADR-0002 has not received human architecture review.
    unblock_condition: Review the proposed canonical paths and structured consumer mappings, add durable evidence for any observed distribution, and accept or revise ADR-0002.
  - id: paired-greek-identity-repository
    description: Decide the ownership and synchronization boundary for the separately paired Greek identity repository referenced by Pantechnoesis governance.
    reason: Authenticated read-only lookup did not find the requested canonical Greek target. A private ambiguous candidate exists, but its identity alignment is unverified and its identifier is intentionally withheld from this public registry.
    unblock_condition: The accountable human must confirm the exact canonical target or explicitly defer Greek publication. If a candidate is selected, inspect identity and visibility under least privilege before adding any repository, module, remote, or synchronization claim.
