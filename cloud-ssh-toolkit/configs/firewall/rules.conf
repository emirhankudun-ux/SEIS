# Cloud SSH Toolkit - UFW Firewall Kuralları

# Varsayılan politikalar
*filter
:ufw-user-input ACCEPT [0:0]
:ufw-user-output ACCEPT [0:0]
:ufw-user-forward ACCEPT [0:0]
:ufw-before-logging-input - [0:0]
:ufw-before-logging-output - [0:0]
:ufw-before-logging-forward - [0:0]
:ufw-user-logging-input - [0:0]
:ufw-user-logging-output - [0:0]
:ufw-user-logging-forward - [0:0]
:ufw-after-logging-input - [0:0]
:ufw-after-logging-output - [0:0]
:ufw-after-logging-forward - [0:0]
:ufw-logging-deny - [0:0]
:ufw-logging-allow - [0:0]
:ufw-user-limit - [0:0]
:ufw-user-limit-accept - [0:0]
COMMIT

# Default policies
DEFAULT_INPUT_POLICY="DROP"
DEFAULT_OUTPUT_POLICY="ACCEPT"
DEFAULT_FORWARD_POLICY="DROP"
DEFAULT_APPLICATION_POLICY="SKIP"

# Logging
LOGLEVEL="low"

# SSH - Port 22 (veya özel port)
-A ufw-before-input -p tcp --dport 22 -m state --state NEW -m recent --set
-A ufw-before-input -p tcp --dport 22 -m state --state NEW -m recent --update --seconds 30 --hitcount 6 -j DROP
-A ufw-before-input -p tcp --dport 22 -j ACCEPT

# Özel SSH portu kullanıyorsanız (örnek: 2222)
# -A ufw-before-input -p tcp --dport 2222 -m state --state NEW -m recent --set
# -A ufw-before-input -p tcp --dport 2222 -m state --state NEW -m recent --update --seconds 30 --hitcount 6 -j DROP
# -A ufw-before-input -p tcp --dport 2222 -j ACCEPT

# Loopback interface
-A ufw-before-input -i lo -j ACCEPT
-A ufw-before-output -o lo -j ACCEPT

# Established connections
-A ufw-before-input -m state --state ESTABLISHED,RELATED -j ACCEPT
-A ufw-before-output -m state --state ESTABLISHED,RELATED -j ACCEPT

# HTTP/HTTPS (Web sunucusu için opsiyonel)
-A ufw-before-input -p tcp --dport 80 -j ACCEPT
-A ufw-before-input -p tcp --dport 443 -j ACCEPT

# ICMP (ping) - rate limited
-A ufw-before-input -p icmp --icmp-type echo-request -m limit --limit 1/s --limit-burst 4 -j ACCEPT

# Invalid packets
-A ufw-before-input -m state --state INVALID -j DROP

# Rate limiting for SSH
-A ufw-user-limit -m limit --limit 3/minute -j LOG --log-prefix "UFW LIMIT BLOCK "
-A ufw-user-limit -j REJECT
-A ufw-user-limit-accept -j ACCEPT

# Allow specific IP ranges (opsiyonel)
# -A ufw-before-input -s 192.168.1.0/24 -p tcp --dport 22 -j ACCEPT
# -A ufw-before-input -s 10.0.0.0/8 -p tcp --dport 22 -j ACCEPT

# Deny all other incoming traffic by default
