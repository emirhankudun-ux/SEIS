<script>
        // Micro-interaction for inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
                input.parentElement.parentElement.classList.add('transition-transform');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Pulsing status dot logic (Atmospheric)
        const createPulse = () => {
            const dot = document.createElement('div');
            dot.className = 'fixed w-1 h-1 bg-primary-fixed-dim rounded-full pointer-events-none opacity-0';
            dot.style.left = Math.random() * 100 + 'vw';
            dot.style.top = Math.random() * 100 + 'vh';
            document.body.appendChild(dot);

            const animation = dot.animate([
                { opacity: 0, transform: 'scale(0)' },
                { opacity: 0.4, transform: 'scale(2)' },
                { opacity: 0, transform: 'scale(0)' }
            ], {
                duration: 4000 + Math.random() * 4000,
                easing: 'ease-in-out'
            });

            animation.onfinish = () => dot.remove();
        };

        setInterval(createPulse, 2000);
    </script>
