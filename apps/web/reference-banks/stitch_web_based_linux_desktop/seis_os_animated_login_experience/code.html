<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SEIS OS Login</title>
<style>
        :root {
            --seis-background: #111414;
            --seis-surface: #111414;
            --seis-surface-container: #1d2020;
            --seis-surface-container-low: #191c1c;
            --seis-surface-variant: #323535;
            --seis-surface-dim: #111414;
            --seis-on-background: #e1e3e2;
            --seis-on-surface: #e1e3e2;
            --seis-on-surface-variant: #cfc2d6;
            --seis-outline-variant: #4d4354;
            --seis-outline: #988d9f;
            --seis-primary: #ddb7ff;
            --seis-on-primary: #490080;
            --seis-inverse-surface: #e1e3e2;
            --seis-primary-fixed: #f0dbff;
            --seis-primary-fixed-dim: #ddb7ff;
            --seis-tertiary: #ffb2b7;
            --seis-on-tertiary: #67001b;
        }

        .glass-panel {
            background-color: rgba(26, 28, 28, 0.7);
            backdrop-filter: blur(48px);
            -webkit-backdrop-filter: blur(48px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 100px 10px rgba(168, 85, 247, 0.1);
            transition: transform 0.1s ease-out, opacity 0.5s ease-out;
            transform-style: preserve-3d;
        }
        
        .glass-panel.unlocking {
            opacity: 0;
            transform: scale(0.95) translateZ(-50px) !important;
            pointer-events: none;
        }

        .input-glow:focus {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
            border-color: #d8b4fe;
            background-color: rgba(0,0,0,0.8);
        }

        @keyframes breathe {
            0%, 100% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.3); }
            50% { box-shadow: 0 0 50px rgba(168, 85, 247, 0.6); }
        }

        .avatar-glow {
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .loading-spinner {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top-color: #490080;
            border-right-color: #490080;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .is-loading .arrow-icon {
            opacity: 0;
        }

        .is-loading .loading-spinner {
            display: block;
        }

        @media (prefers-reduced-motion: reduce) {
            .glass-panel { transition: none; transform: none !important; }
            .avatar-glow { animation: none; }
            .loading-spinner { animation-duration: 1.5s; }
        }

        .dark {
            color-scheme: dark;
        }

        .absolute { position: absolute; }
        .relative { position: relative; }
        .fixed { position: fixed; }
        .inset-0 { inset: 0; }
        .h-screen { height: 100vh; }
        .w-screen { width: 100vw; }
        .h-full { height: 100%; }
        .w-full { width: 100%; }
        .w-12 { width: 3rem; }
        .h-12 { height: 3rem; }
        .w-8 { width: 2rem; }
        .h-8 { height: 2rem; }
        .w-32 { width: 8rem; }
        .h-32 { height: 8rem; }
        .overflow-hidden { overflow: hidden; }
        .overflow-auto { overflow: auto; }
        .overflow-x-hidden { overflow-x: hidden; }
        .overflow-y-auto { overflow-y: auto; }
        .bg-background,
        .bg-surface { background-color: var(--seis-background); }
        .bg-primary { background-color: var(--seis-primary); }
        .bg-\[\#1A1C1C\]\/70 { background-color: rgba(26, 28, 28, 0.7); }
        .bg-\[\#000000\]\/80 { background-color: rgba(0, 0, 0, 0.8); }
        .bg-white\/10 { background-color: rgba(255, 255, 255, 0.1); }
        .text-on-background { color: var(--seis-on-background); }
        .text-on-surface { color: var(--seis-on-surface); }
        .text-on-surface-variant { color: var(--seis-on-surface-variant); }
        .text-primary { color: var(--seis-primary); }
        .text-on-primary { color: var(--seis-on-primary); }
        .text-\[16px\] { font-size: 16px; }
        .text-center { text-align: center; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .gap-4 { gap: 1rem; }
        .gap-unit { gap: 8px; }
        .gap-gutter { gap: 24px; }
        .mb-unit { margin-bottom: 8px; }
        .mb-gutter { margin-bottom: 24px; }
        .mt-2 { margin-top: 0.5rem; }
        .px-10 { padding-left: 2.5rem; padding-right: 2.5rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
        .p-container-padding { padding: 32px; }
        .pt-12 { padding-top: 3rem; }
        .text-white { color: #fff; }
        .font-bold { font-weight: 700; }
        .font-body-md { font-size: 16px; line-height: 1.6; font-weight: 400; font-family: "Segoe UI", system-ui, sans-serif; }
        .font-display { font-size: 48px; line-height: 1.1; letter-spacing: -0.02em; font-weight: 700; font-family: "Segoe UI", system-ui, sans-serif; }
        .font-headline-md { font-size: 24px; line-height: 1.3; letter-spacing: 0; font-weight: 500; font-family: "Segoe UI", system-ui, sans-serif; }
        .font-label-sm { font-size: 12px; line-height: 1; letter-spacing: 0.05em; font-weight: 500; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        .font-code-md { font-size: 14px; line-height: 1.5; font-weight: 400; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-full { border-radius: 9999px; }
        .rounded-[24px] { border-radius: 24px; }
        .border { border-width: 1px; border-style: solid; }
        .border-b { border-bottom-width: 1px; border-bottom-style: solid; }
        .border-2 { border-width: 2px; }
        .border-outline-variant { border-color: var(--seis-outline-variant); }
        .border-primary\/50 { border-color: color-mix(in srgb, var(--seis-primary) 50%, transparent); }
        .border-white\/10 { border-color: rgba(255, 255, 255, 0.1); }
        .transition-all { transition: all 0.3s ease; }
        .transition-colors { transition-property: color, background-color, border-color; transition-duration: 0.15s; transition-timing-function: ease; }
        .transition-opacity { transition-property: opacity; transition-duration: 0.5s; transition-timing-function: ease; }
        .duration-200 { transition-duration: 200ms; }
        .duration-300 { transition-duration: 300ms; }
        .duration-500 { transition-duration: 500ms; }
        .hover\:bg-white\/10:hover { background-color: rgba(255, 255, 255, 0.1); }
        .hover\:scale-110:hover { transform: scale(1.1); }
        .transform { transform: translateZ(0); }
        .transform-style-preserve-3d { transform-style: preserve-3d; }
        .translate-z-\[10px\] { transform: translateZ(10px); }
        .translate-z-\[20px\] { transform: translateZ(20px); }
        .translate-z-\[30px\] { transform: translateZ(30px); }
        .-translate-y-1\/2 { transform: translateY(-50%); }
        .right-2 { right: 0.5rem; }
        .top-1\/2 { top: 50%; }
        .top-0 { top: 0; }
        .left-safe-area { left: 40px; }
        .right-safe-area { right: 40px; }
        .bottom-safe-area { bottom: 40px; }
        .z-10 { z-index: 10; }
        .z-50 { z-index: 50; }
        .-z-10 { z-index: -10; }
        .z-\-10 { z-index: -10; }
        .flex-col { flex-direction: column; }
        .object-cover { object-fit: cover; }
        .border-white\/10 { border-color: rgba(255, 255, 255, 0.1); }
        .backdrop-blur-sm,
        .backdrop-blur-3xl { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .filter { filter: blur(0); }
        .blur-\[10px\] { filter: blur(10px); }
        .scale-110 { transform: scale(1.1); }
        .opacity-70 { opacity: 0.7; }
        .opacity-0 { opacity: 0; }
        .duration-1000 { transition-duration: 1000ms; }
        .-translate-x-1\/2 { transform: translateX(-50%); }
        .-translate-y-1\/2 { transform: translateY(-50%); }
        .pointer-events-none { pointer-events: none; }
        .outline-none { outline: none; }
        .focus\:outline-none:focus { outline: none; }
        .placeholder-on-surface-variant::placeholder { color: var(--seis-on-surface-variant); }
        .pointer-events-auto { pointer-events: auto; }
        .perspective-\[1000px\] { perspective: 1000px; }
        .gap-unit { gap: 8px; }
        .bg-transparent { background-color: transparent; }
        .text-label-sm { font-size: 12px; line-height: 1; letter-spacing: 0.05em; font-weight: 500; }
        .text-headline-md { font-size: 24px; }
        .text-display { font-size: 48px; }
        .shadow-\[0_0_15px_rgba\(168,85,247,0\.5\)\] { box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }

        .material-symbols-outlined {
            display: inline-block;
            min-width: 1.2em;
            text-align: center;
            font-style: normal;
            font-weight: 400;
            font-size: 20px;
            color: var(--seis-on-surface-variant);
        }

        #bg-shader {
            background: radial-gradient(circle at 20% 20%, rgba(75, 47, 143, 0.2), transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(0, 128, 255, 0.1), transparent 30%);
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        .avatar-surface {
            border: 1px solid rgba(255, 255, 255, 0.14);
            background:
                radial-gradient(circle at 30% 20%, rgba(168, 85, 247, 0.32), transparent 40%),
                radial-gradient(circle at 70% 80%, rgba(66, 165, 245, 0.18), transparent 45%),
                linear-gradient(160deg, #2a1f3c 0%, #1b1d2a 50%, #222f3a 100%);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.35), 0 0 18px rgba(168, 85, 247, 0.22);
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--seis-background);
        }

        .text-on-error,
        .on-error {
            color: #ffb4ab;
        }

        .max-w-md {
            max-width: 28rem;
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden relative font-body-md">
<!-- Background Shader (Blurred) -->
<div class="absolute inset-0 w-full h-full filter blur-[10px] scale-110 -z-10 transition-opacity duration-1000" id="bg-shader">

</div>
<!-- Top System Bar -->
<header class="flex justify-between items-center w-full px-10 h-12 fixed top-0 z-50 bg-[#1A1C1C]/70 backdrop-blur-3xl border-b border-white/10 transition-opacity duration-500" id="sys-header">
<div class="font-headline-md text-headline-md font-bold text-primary">SEIS OS</div>
<div class="flex gap-4 items-center">
<span class="material-symbols-outlined text-primary font-label-sm" data-icon="signal_cellular_4_bar">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-primary font-label-sm" data-icon="battery_charging_full">battery_charging_full</span>
<span class="material-symbols-outlined text-primary font-label-sm" data-icon="schedule">schedule</span>
</div>
</header>
<!-- Main Content Area -->
<main class="h-full w-full flex items-center justify-center relative z-10 pt-12 perspective-[1000px]" id="main-container">
<!-- Login Card -->
<div class="glass-panel rounded-[24px] p-container-padding w-full max-w-md flex flex-col items-center" id="login-card">
<!-- Avatar -->
<div class="w-32 h-32 rounded-full overflow-hidden border-2 border-primary/50 mb-unit relative avatar-glow transform translate-z-[20px]">
<div class="avatar-surface w-full h-full"></div>
</div>
<!-- Username -->
<h1 class="font-display text-display text-on-surface mb-gutter transform translate-z-[10px]">Emirhan</h1>
<!-- Login Form -->
<form class="w-full flex flex-col gap-unit transform translate-z-[30px]" id="login-form">
<div class="relative w-full">
<input class="w-full bg-[#000000]/80 backdrop-blur-sm border border-outline-variant rounded-lg px-4 py-3 font-code-md text-code-md text-on-surface placeholder-on-surface-variant focus:outline-none input-glow transition-all duration-300" id="password-input" placeholder="Password" type="password"/>
<button class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center rounded-full bg-primary text-on-primary hover:scale-110 transition-all duration-200 shadow-[0_0_15px_rgba(168,85,247,0.5)] overflow-hidden" id="submit-btn" type="submit">
<span class="material-symbols-outlined text-[16px] arrow-icon transition-opacity duration-200" data-icon="arrow_forward">arrow_forward</span>
<div class="loading-spinner"></div>
</button>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant text-center mt-2 opacity-70">Enter credentials to unlock SEIS OS</p>
</form>
</div>
</main>
<!-- Bottom Action Icons -->
<div class="fixed bottom-safe-area left-safe-area z-50 flex gap-gutter transition-opacity duration-500" id="sys-actions-left">
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center hover:bg-white/10 transition-colors duration-300">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="power_settings_new">power_settings_new</span>
</button>
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center hover:bg-white/10 transition-colors duration-300">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="nightlight">nightlight</span>
</button>
</div>
<div class="fixed bottom-safe-area right-safe-area z-50 flex gap-gutter transition-opacity duration-500" id="sys-actions-right">
<button class="w-12 h-12 rounded-full glass-panel flex items-center justify-center hover:bg-white/10 transition-colors duration-300">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="accessibility_new">accessibility_new</span>
</button>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const card = document.getElementById('login-card');
        const container = document.getElementById('main-container');
        const form = document.getElementById('login-form');
        const btn = document.getElementById('submit-btn');
        const input = document.getElementById('password-input');
        
        // Parallax Effect
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        
        if (!prefersReducedMotion) {
            container.addEventListener('mousemove', (e) => {
                if(card.classList.contains('unlocking')) return;
                
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -10; // Max 10 deg rotation
                const rotateY = ((x - centerX) / centerX) * 10;
                
                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
            });
            
            container.addEventListener('mouseleave', () => {
                if(!card.classList.contains('unlocking')){
                    card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
                }
            });
        }

        // Unlock Sequence
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if(!input.value) return; // Simple validation
            
            // Add loading state
            btn.classList.add('is-loading');
            input.disabled = true;
            
            // Simulate auth delay
            setTimeout(() => {
                card.classList.add('unlocking');
                document.getElementById('sys-header').style.opacity = '0';
                document.getElementById('sys-actions-left').style.opacity = '0';
                document.getElementById('sys-actions-right').style.opacity = '0';
                document.getElementById('bg-shader').style.opacity = '0.5';
                
                // Reset (for demo purposes)
                setTimeout(() => {
                    btn.classList.remove('is-loading');
                    input.disabled = false;
                    input.value = '';
                    card.classList.remove('unlocking');
                    document.getElementById('sys-header').style.opacity = '1';
                    document.getElementById('sys-actions-left').style.opacity = '1';
                    document.getElementById('sys-actions-right').style.opacity = '1';
                    document.getElementById('bg-shader').style.opacity = '1';
                }, 2000);
            }, 1000);
        });
    });
</script>
</body></html>
