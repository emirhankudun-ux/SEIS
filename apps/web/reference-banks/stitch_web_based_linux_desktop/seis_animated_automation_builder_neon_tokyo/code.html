<style>
        :root {
            --neon-magenta: #ff00ff;
            --neon-purple: #bc13fe;
            --neon-cyan: #00dbe9;
            --obsidian: #0c0f0f;
        }

        body {
            background-color: var(--obsidian);
            color: #e2e2e2;
            overflow: hidden;
            font-family: 'Geist', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(18, 20, 20, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .node-glow-magenta { box-shadow: 0 0 15px rgba(255, 0, 255, 0.2); }
        .node-glow-purple { box-shadow: 0 0 15px rgba(188, 19, 254, 0.2); }
        .node-glow-cyan { box-shadow: 0 0 15px rgba(0, 219, 233, 0.2); }

        .grid-bg {
            background-image: 
                linear-gradient(rgba(188, 19, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(188, 19, 254, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(255, 0, 255, 0.1);
            opacity: 0.75;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: 0%; }
        }

        /* Motion and Interactivity Classes */
        @media (prefers-reduced-motion: no-preference) {
            .node-entrance {
                opacity: 0;
                transform: translateY(20px);
                animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }

            .node-entrance:nth-child(1) { animation-delay: 0.1s; }
            .node-entrance:nth-child(2) { animation-delay: 0.2s; }
            .node-entrance:nth-child(3) { animation-delay: 0.3s; }
            .node-entrance:nth-child(4) { animation-delay: 0.4s; }

            @keyframes fadeInUp {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            .node-interactive {
                transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .node-interactive:hover {
                transform: scale(1.02) translateY(-4px);
                box-shadow: 0 12px 30px rgba(188, 19, 254, 0.3), 0 0 15px rgba(0, 219, 233, 0.4);
                z-index: 10;
            }

            .breathing-connection {
                animation: breathGlow 3s ease-in-out infinite alternate;
                stroke-dasharray: 10 5;
                animation-name: breathGlow, dashMove;
                animation-duration: 3s, 20s;
                animation-timing-function: ease-in-out, linear;
                animation-iteration-count: infinite, infinite;
            }

            @keyframes breathGlow {
                0% { filter: drop-shadow(0 0 2px var(--neon-magenta)); stroke-width: 2px; }
                100% { filter: drop-shadow(0 0 8px var(--neon-cyan)); stroke-width: 3px; }
            }
            
            @keyframes dashMove {
                to {
                    stroke-dashoffset: -1000;
                }
            }

            .btn-pulse {
                position: relative;
                overflow: hidden;
            }

            .btn-pulse::after {
                content: '';
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 0;
                box-shadow: inset 0 0 0 2px var(--neon-cyan);
                border-radius: inherit;
                opacity: 0;
                animation: buttonPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }

            @keyframes buttonPulse {
                0% { transform: scale(0.95); opacity: 1; }
                100% { transform: scale(1.1); opacity: 0; }
            }
            
            .parallax-layer {
                transition: transform 0.1s cubic-bezier(0.1, 0.5, 0.9, 0.5);
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333535; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-purple); }

        .canvas-container {
            cursor: grab;
        }
        .canvas-container:active {
            cursor: grabbing;
        }
    </style>

<script>
    // Mouse Parallax Effect
    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('parallax-container');
        const layers = document.querySelectorAll('.parallax-layer');
        
        // Respect prefers-reduced-motion
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        
        if (!prefersReducedMotion && container) {
            container.addEventListener('mousemove', (e) => {
                const x = (e.clientX - window.innerWidth / 2);
                const y = (e.clientY - window.innerHeight / 2);

                layers.forEach(layer => {
                    const speed = layer.getAttribute('data-speed') || 0.5;
                    const xOffset = (x * speed) / 10;
                    const yOffset = (y * speed) / 10;
                    layer.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
                });
            });

            container.addEventListener('mouseleave', () => {
                layers.forEach(layer => {
                    layer.style.transform = `translate(0px, 0px)`;
                });
            });
        }
    });
</script>
