<style>
        :root {
            --neon-magenta: #ff00ff;
            --neon-purple: #bc13fe;
            --neon-cyan: #00dbe9;
            --obsidian: #0c0f0f;
        }

        body {
            background-color: var(--obsidian);
            color: #e2e2e2;
            overflow: hidden;
            font-family: 'Geist', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(18, 20, 20, 0.8);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .node-glow-magenta { box-shadow: 0 0 15px rgba(255, 0, 255, 0.2); }
        .node-glow-purple { box-shadow: 0 0 15px rgba(188, 19, 254, 0.2); }
        .node-glow-cyan { box-shadow: 0 0 15px rgba(0, 219, 233, 0.2); }

        .grid-bg {
            background-image: 
                linear-gradient(rgba(188, 19, 254, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(188, 19, 254, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: rgba(255, 0, 255, 0.1);
            opacity: 0.75;
            position: absolute;
            bottom: 100%;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { bottom: 100%; }
            100% { bottom: 0%; }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333535; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-purple); }

        .canvas-container {
            cursor: grab;
        }
        .canvas-container:active {
            cursor: grabbing;
        }
    </style>
