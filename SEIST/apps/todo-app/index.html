<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App | SEIS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="todo-wrapper">
            <header>
                <h1>📝 To-Do List</h1>
                <p class="subtitle">Stay organized and productive</p>
            </header>

            <div class="input-section">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="Add a new task..." 
                    class="todo-input"
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">
                    <span>+</span>
                </button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>

            <div class="stats">
                <span class="stat-item">
                    <span class="label">Total:</span>
                    <span id="totalCount" class="count">0</span>
                </span>
                <span class="stat-item">
                    <span class="label">Completed:</span>
                    <span id="completedCount" class="count">0</span>
                </span>
            </div>

            <ul id="todoList" class="todo-list">
                <!-- Tasks will be added here -->
            </ul>

            <div class="empty-state">
                <p>🎉 No tasks yet. Add one to get started!</p>
            </div>

            <div class="actions">
                <button id="clearBtn" class="clear-btn">Clear Completed</button>
                <button id="resetBtn" class="reset-btn">Reset All</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
