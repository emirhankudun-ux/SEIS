name: Foundation Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run lightweight checks
        run: |
          npm run check:js
          npm run check:foundation
          npm run package:server
          npm run prepare:server
