name: SEIS SSH Public Access

on:
  pull_request:
    paths:
      - ".github/workflows/seis-ssh-public-access.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/seis_ssh_access.yml"
      - "README.md"
      - "apps/web/desktop.js"
      - "deploy/seis-ssh-*.json"
      - "content/development/seis-ssh-live-readiness-evidence.json"
      - "docs/deployment/seis-ssh-*.md"
      - "docs/roadmap/MASTER_BACKLOG.md"
      - "docs/roadmap/NEXT_PR_QUEUE.md"
      - "scripts/check-seis-ssh-public-*.mjs"
      - "scripts/create-seis-ssh-public-*.mjs"
      - "scripts/check-seis-ssh-live-readiness-evidence.mjs"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/seis-ssh-public-access.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/seis_ssh_access.yml"
      - "README.md"
      - "apps/web/desktop.js"
      - "deploy/seis-ssh-*.json"
      - "content/development/seis-ssh-live-readiness-evidence.json"
      - "docs/deployment/seis-ssh-*.md"
      - "docs/roadmap/MASTER_BACKLOG.md"
      - "docs/roadmap/NEXT_PR_QUEUE.md"
      - "scripts/check-seis-ssh-public-*.mjs"
      - "scripts/create-seis-ssh-public-*.mjs"
      - "scripts/check-seis-ssh-live-readiness-evidence.mjs"
      - "package.json"

permissions:
  contents: read

jobs:
  public-access:
    name: SEIS SSH public access gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Validate public SEIS-SSH GitHub gates
        run: |
          npm run check:seis-ssh-public-ci-workflow
          npm run check:seis-ssh-public-pr-template
          npm run check:seis-ssh-public-access
          npm run check:seis-ssh-public-github-quickstart
          npm run check:seis-ssh-public-support-packet
          npm run check:seis-ssh-public-readiness-matrix
          npm run check:seis-ssh-public-artifact-hygiene
          npm run check:seis-ssh-live-readiness-evidence
          git diff --check
