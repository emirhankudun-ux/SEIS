name: SEIS-SSH Public Access Contract

on:
  pull_request:
    paths:
      - '.github/workflows/seis-ssh-public-access.yml'
      - 'deploy/seis-ssh-*.json'
      - 'docs/deployment/seis-ssh-*.md'
      - 'docs/deployment/seis-codex-git-ssh-handoff.md'
      - 'scripts/check-seis-ssh-*.mjs'
      - 'scripts/create-seis-ssh-public-*.mjs'
      - 'content/development/seis-ssh-*.json'
      - 'apps/web/desktop.js'
      - 'docs/STATUS.md'
      - 'docs/roadmap/MASTER_BACKLOG.md'
      - 'docs/roadmap/NEXT_PR_QUEUE.md'
      - 'package.json'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seis-ssh-public-access-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Static SEIS-SSH GitHub contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Run static SSH and GitHub gates
        run: |
          npm run check:seis-ssh-github-pr-contract
          npm run check:seis-ssh-public-access
          npm run check:seis-ssh-public-access-report
          npm run check:seis-ssh-public-onboarding
          npm run check:seis-ssh-public-contributor-doctor
          npm run check:seis-ssh-live-readiness-evidence
          npm run check:seis-ssh-access-model
          npm run check:seis-ssh-cloud-roadmap
          npm run check:seis-ssh-closed-runtime
          npm run check:seis-ssh-enterprise-benchmark
          git diff --check

      - name: Record safety boundary
        if: always()
        run: |
          {
            echo '## SEIS-SSH Public Access Contract'
            echo '- Static repository and PR checks only.'
            echo '- Live SSH, GitHub authentication, credentials, deployment, and server/port mutation are not executed.'
            echo '- Live-ready and mobile-24x7 claims remain blocked until approved strict evidence exists.'
          } >> "$GITHUB_STEP_SUMMARY"
