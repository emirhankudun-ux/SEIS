name: SEIS System Gates

on:
  pull_request:
    paths:
      - "goals/**"
      - "docs/governance/**"
      - "docs/architecture/**"
      - "docs/ai/**"
      - "docs/decisions/**"
      - "governance/**"
      - "ai/**"
      - "roadmap/**"
      - "content/**"
      - "scripts/check-seis-enterprise-gates.mjs"
      - ".github/**"
  push:
    branches: [main]
    paths:
      - "goals/**"
      - "docs/governance/**"
      - "docs/architecture/**"
      - "docs/ai/**"
      - "docs/decisions/**"
      - "governance/**"
      - "ai/**"
      - "roadmap/**"
      - "content/**"
      - "scripts/check-seis-enterprise-gates.mjs"
      - ".github/**"

permissions:
  contents: read

jobs:
  enterprise-gates:
    name: Enterprise gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: npm run check:seis-enterprise-gates:quality

      - name: Security gate
        run: npm run check:seis-enterprise-gates:security

      - name: AI gate
        run: npm run check:seis-enterprise-gates:ai

      - name: LLM policy gate
        run: npm run check:llm-orchestration-policy
