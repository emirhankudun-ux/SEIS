name: SEIS Open Source Governance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  governance:
    name: Open source governance check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check SEIS open source governance
        run: npm run check:open-source-governance
