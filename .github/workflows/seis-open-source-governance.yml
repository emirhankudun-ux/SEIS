name: SEIS Open Source Governance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  governance:
    name: Open source governance check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Check SEIS open source governance
        run: npm run check:open-source-governance
