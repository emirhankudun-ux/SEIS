name: SEIS Open Source Governance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  governance:
    name: Open source governance check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
      - name: Check SEIS open source governance
        run: npm run check:open-source-governance
