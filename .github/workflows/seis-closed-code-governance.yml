name: SEIS CLOSED CODE Governance

on:
  push:
    branches:
      - main
      - UIXAppTTR
  pull_request:
    branches:
      - main
      - UIXAppTTR

jobs:
  governance:
    name: SEIS closed-code governance check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check SEIS CLOSED CODE files
        run: node scripts/check-seis-closed-code.mjs
