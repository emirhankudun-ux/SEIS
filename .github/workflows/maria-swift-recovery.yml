name: MARIA Swift Recovery

on:
  pull_request:
    paths:
      - 'packages/seis_platform_swift/**'
      - 'packages/maria-runtime/**'
      - 'test/maria-swift-recovery-parity.test.py'
      - 'test/fixtures/maria-recovery-swift-v1.json'
      - '.github/workflows/maria-swift-recovery.yml'
      - 'scripts/check-maria-swift-cancellation-mutations.py'

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Record native toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Verify Python to Swift fixture parity
        run: python3 test/maria-swift-recovery-parity.test.py
      - name: Build existing native shell
        run: swift build --package-path packages/seis_platform_swift --product SeisAppleNativeShell
      - name: Test existing Swift package and render recovery views
        env:
          MARIA_UI_EVIDENCE_DIR: ${{ runner.temp }}/maria-recovery-render
        run: swift test --package-path packages/seis_platform_swift
      - name: Verify recovery import concurrency with Thread Sanitizer
        run: >-
          swift test --package-path packages/seis_platform_swift
          --sanitize=thread --disable-xctest
          --filter 'SeisMariaRecovery(Cancellation|AsyncReader)Tests'
      - name: Verify cancellation regression sensitivity without mutating checkout
        run: python3 scripts/check-maria-swift-cancellation-mutations.py
      - name: Retain synthetic recovery render evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: maria-recovery-render
          path: ${{ runner.temp }}/maria-recovery-render/*.png
          if-no-files-found: error
          retention-days: 7
