name: CI

on:
  push:
    branches: [main, develop, UIXAppTTR]
  pull_request:
    branches: [main, develop, UIXAppTTR]

jobs:
  # ── 1. Governance quality checks ──────────────────────────────────────────
  quality:
    name: Governance quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        run: npm run quality

  # ── 2. Unit tests (Vitest) ─────────────────────────────────────────────────
  unit:
    name: Unit tests — packages/core + packages/ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: packages/*/coverage/

  # ── 3. Content JSON schema validation ─────────────────────────────────────
  schema:
    name: Content JSON schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install packages/core dependencies
        run: npm install --prefix packages/core --no-package-lock

      - name: Run schema tests
        run: |
          cd packages/core
          npx vitest run src/schemas.test.ts

  # ── 4. E2E tests (Playwright) ─────────────────────────────────────────────
  e2e:
    name: E2E tests — accessibility + reduced-motion + render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── 5. Branch protection gate ──────────────────────────────────────────────
  gate:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [quality, unit, schema, e2e]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[  "${{ needs.quality.result }}" != "success" ||
                "${{ needs.unit.result }}" != "success" ||
                "${{ needs.schema.result }}" != "success" ||
                "${{ needs.e2e.result }}" != "success" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
