name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Governance quality checks ──────────────────────────────────────────
  governance:
    name: Core SEIS audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run governance quality gate
        run: npm run quality:governance

  # ── 2. Unit tests (Vitest) ─────────────────────────────────────────────────
  unit:
    name: Unit tests — packages/core + packages/ui
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ── 3. Content JSON schema validation ─────────────────────────────────────
  schema:
    name: Content JSON schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run schema tests
        run: |
          cd packages/core
          npx vitest run src/schemas.test.ts

  # ── 4. Branch protection gate ──────────────────────────────────────────────
  gate:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [governance, unit, schema]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.governance.result }}" != "success" ||
                "${{ needs.unit.result }}" != "success" ||
                "${{ needs.schema.result }}" != "success" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All required jobs passed."
