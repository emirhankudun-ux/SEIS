name: MARIA Intelligence Fabric

on:
  pull_request:
    paths:
      - 'packages/maria-runtime/**'
      - 'test/maria-intelligence-fabric.test.py'
      - 'test/maria-mcp-invocation-guard.test.py'
      - 'test/maria-mcp-executor.test.py'
      - 'test/maria-mcp-work-runner.test.py'
      - 'test/maria-model-work-runner.test.py'
      - 'test/maria-runtime-output-redaction.test.py'
      - 'test/maria-mcp-secret-resolution.test.py'
      - 'test/maria-mcp-keychain-source.test.py'
      - 'test/maria-mcp-e2e-fixture.test.py'
      - 'test/fixtures/mcp_fixture_server.py'
      - 'test/maria-work-routing.test.py'
      - 'test/maria-work-execution.test.py'
      - 'test/maria-mcp-process-supervisor.test.py'
      - 'test/maria-mcp-process-path-policy.test.py'
      - 'test/maria-mcp-protocol-negotiation.test.py'
      - 'test/maria-mcp-stdio-framing.test.py'
      - 'test/maria-mcp-stdio-transport.test.py'
      - 'test/maria-local-runtime-discovery.test.py'
      - 'test/maria-local-capability-normalization.test.py'
      - 'test/maria-local-runtime-health.test.py'
      - 'test/maria-local-discovery-coordinator.test.py'
      - 'test/maria-local-routing-integration.test.py'
      - 'test/maria-local-runtime-status.test.py'
      - 'docs/architecture/MARIA_INTELLIGENCE_FABRIC_V1.md'
      - 'docs/architecture/MARIA_LOCAL_RUNTIME_PROBES.md'
      - 'docs/architecture/MARIA_MCP_PROCESS_SUPERVISOR.md'
      - 'docs/architecture/MARIA_MCP_STDIO_TRANSPORT.md'
      - 'docs/architecture/MARIA_MCP_INVOCATION_EXECUTOR.md'
      - 'docs/architecture/MARIA_WORK_ROUTING.md'
      - '.github/workflows/maria-intelligence-fabric.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python3 test/maria-intelligence-fabric.test.py
      - run: python3 test/maria-mcp-invocation-guard.test.py
      - run: python3 test/maria-mcp-executor.test.py
      - run: python3 test/maria-mcp-work-runner.test.py
      - run: python3 test/maria-model-work-runner.test.py
      - run: python3 test/maria-runtime-output-redaction.test.py
      - run: python3 test/maria-mcp-secret-resolution.test.py
      - run: python3 test/maria-mcp-keychain-source.test.py
      - run: python3 test/maria-mcp-e2e-fixture.test.py
      - run: python3 test/maria-work-routing.test.py
      - run: python3 test/maria-work-execution.test.py
      - run: python3 test/maria-mcp-process-supervisor.test.py
      - run: python3 test/maria-mcp-process-path-policy.test.py
      - run: python3 test/maria-mcp-protocol-negotiation.test.py
      - run: python3 test/maria-mcp-stdio-framing.test.py
      - run: python3 test/maria-mcp-stdio-transport.test.py
      - run: python3 test/maria-local-runtime-discovery.test.py
      - run: python3 test/maria-local-capability-normalization.test.py
      - run: python3 test/maria-local-runtime-health.test.py
      - run: python3 test/maria-local-discovery-coordinator.test.py
      - run: python3 test/maria-local-routing-integration.test.py
      - run: python3 test/maria-local-runtime-status.test.py
      - run: python3 test/maria-runtime-v18.test.py
