name: MARIA Intelligence Fabric

on:
  pull_request:
    paths:
      - 'packages/maria-runtime/**'
      - 'test/maria-intelligence-fabric.test.py'
      - 'test/maria-mcp-invocation-guard.test.py'
      - 'test/maria-local-runtime-discovery.test.py'
      - 'test/maria-local-runtime-health.test.py'
      - 'test/maria-local-discovery-coordinator.test.py'
      - 'docs/architecture/MARIA_INTELLIGENCE_FABRIC_V1.md'
      - 'docs/architecture/MARIA_LOCAL_RUNTIME_PROBES.md'
      - '.github/workflows/maria-intelligence-fabric.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python3 test/maria-intelligence-fabric.test.py
      - run: python3 test/maria-mcp-invocation-guard.test.py
      - run: python3 test/maria-local-runtime-discovery.test.py
      - run: python3 test/maria-local-runtime-health.test.py
      - run: python3 test/maria-local-discovery-coordinator.test.py
      - run: python3 test/maria-runtime-v18.test.py
