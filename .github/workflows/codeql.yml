name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/codeql.yml'
      - 'apps/web/**'
      - 'mcp/**'
      - 'packages/seis-ai/**'
      - 'packages/seis_kernel/**'
      - 'packages/seis_platform_swift/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/codeql.yml'
      - 'apps/web/**'
      - 'mcp/**'
      - 'packages/seis-ai/**'
      - 'packages/seis_kernel/**'
      - 'packages/seis_platform_swift/**'
      - 'scripts/**'
  schedule:
    - cron: '24 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            runner: ubuntu-latest
            build-mode: none
            build_command: ''
          - language: python
            runner: ubuntu-latest
            build-mode: none
            build_command: ''
          - language: swift
            runner: macos-latest
            build-mode: manual
            build_command: swift build --package-path packages/seis_platform_swift --target SeisPlatformKit

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 2

      - name: Determine CodeQL lane scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          should_run="true"

          if [ "${{ matrix.language }}" = "swift" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            should_run="false"
            changed_files="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"

            if printf '%s\n' "$changed_files" | grep -E '^(packages/seis_platform_swift/|apps/(ios|macos)/|polyglot/.*\.swift$)' >/dev/null; then
              should_run="true"
            fi
          fi

          echo "should_run=${should_run}" >> "$GITHUB_OUTPUT"
          echo "CodeQL lane ${{ matrix.language }} should_run=${should_run}"

      - name: Skip CodeQL lane
        if: steps.scope.outputs.should_run != 'true'
        run: echo "Skipping ${{ matrix.language }} CodeQL because this pull request does not touch that language lane."

      - name: Initialize CodeQL
        if: steps.scope.outputs.should_run == 'true'
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build for CodeQL
        if: steps.scope.outputs.should_run == 'true' && matrix.build_command != ''
        run: ${{ matrix.build_command }}

      - name: Perform CodeQL Analysis
        if: steps.scope.outputs.should_run == 'true'
        id: analyze
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: '/language:${{ matrix.language }}'
          output: codeql-results/${{ matrix.language }}
          # Private repositories need GitHub Code Security/GHAS before SARIF can
          # be uploaded to the code scanning API. Keep CodeQL analysis required
          # and preserve SARIF as an artifact until that repository setting is on.
          upload: never

      - name: Validate CodeQL SARIF output
        if: steps.scope.outputs.should_run == 'true'
        run: node scripts/check-codeql-sarif.mjs "${{ steps.analyze.outputs.sarif-output }}"

      - name: Upload CodeQL SARIF artifact
        if: always() && steps.scope.outputs.should_run == 'true' && steps.analyze.outputs.sarif-output != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 14
