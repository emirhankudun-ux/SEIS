name: polyglot

on:
  push:
    branches: [main]
    paths:
      - "polyglot/**"
      - "scripts/polyglot-check.sh"
      - "apps/web/**"
      - ".github/workflows/polyglot.yml"
  pull_request:
    paths:
      - "polyglot/**"
      - "scripts/polyglot-check.sh"
      - "apps/web/**"
      - ".github/workflows/polyglot.yml"

jobs:
  polyglot-audit:
    name: 33-language audit suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # ubuntu-latest ships python3, go, rust, gcc/g++, ruby, php, java,
      # perl, awk, and sqlite3; the orchestrator SKIPs anything missing, so
      # this job stays green on runner image changes while still failing on
      # real findings.
      - name: Install ts-node, bun, lua, tcl, R, ghc, ocaml, nim, elixir, groovy, kotlin, guile, racket, sbcl, swi-prolog, chicken
        run: |
          npm install -g ts-node typescript
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          sudo apt-get update
          sudo apt-get install -y lua5.4 tcl r-base ghc ocaml nim elixir groovy kotlin guile-3.0 racket sbcl swi-prolog chicken-bin
          mkdir -p "$RUNNER_TEMP/R-lib"
          export R_LIBS_USER="$RUNNER_TEMP/R-lib"
          echo "R_LIBS_USER=$R_LIBS_USER" >> "$GITHUB_ENV"
          Rscript -e "install.packages('jsonlite', lib=Sys.getenv('R_LIBS_USER'), repos='https://cran.r-project.org', quiet=TRUE)"

      - name: Toolchain inventory
        run: |
          for t in python3 cargo go gcc g++ ruby php java perl awk sqlite3 ts-node jq xmllint sed yq bash bc bun lua5.4 tclsh Rscript runghc ocaml nim elixir groovy kotlinc-jvm guile racket sbcl swipl csi; do
            printf '%-10s ' "$t"; command -v "$t" >/dev/null && "$t" --version 2>&1 | head -1 || echo "missing"
          done

      # xmllint requires libxml2-utils on ubuntu
      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Run polyglot audit
        run: ./scripts/polyglot-check.sh
