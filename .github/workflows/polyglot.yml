name: polyglot

on:
  push:
    branches: [main]
    paths:
      - "polyglot/**"
      - "scripts/polyglot-check.sh"
      - "apps/web/**"
      - ".github/workflows/polyglot.yml"
  pull_request:
    paths:
      - "polyglot/**"
      - "scripts/polyglot-check.sh"
      - "apps/web/**"
      - ".github/workflows/polyglot.yml"

jobs:
  polyglot-audit:
    name: 15-language audit suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships python3, go, rust, gcc/g++, ruby, php, java,
      # perl, awk, and sqlite3; the orchestrator SKIPs anything missing, so
      # this job stays green on runner image changes while still failing on
      # real findings.
      - name: Install ts-node
        run: npm install -g ts-node typescript

      - name: Toolchain inventory
        run: |
          for t in python3 cargo go gcc g++ ruby php java perl awk sqlite3 ts-node jq xmllint yq; do
            printf '%-10s ' "$t"; command -v "$t" >/dev/null && "$t" --version 2>&1 | head -1 || echo "missing"
          done

      # xmllint requires libxml2-utils on ubuntu
      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Run polyglot audit
        run: ./scripts/polyglot-check.sh
