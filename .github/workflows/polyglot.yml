name: polyglot

on:
  push:
    branches: [main]
    paths:
      - "polyglot/**"
      - "scripts/polyglot-check.sh"
      - "apps/web/**"
      - ".github/workflows/polyglot.yml"
  pull_request:
    paths:
      - "polyglot/**"
      - "scripts/polyglot-check.sh"
      - "apps/web/**"
      - ".github/workflows/polyglot.yml"

jobs:
  polyglot-audit:
    name: 9-language audit suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships python3, go, rust, gcc/g++, ruby, php, java,
      # perl and bash; the orchestrator SKIPs anything missing, so this
      # job stays green on runner image changes while still failing on
      # real findings.
      - name: Toolchain inventory
        run: |
          for t in python3 cargo go gcc g++ ruby php java perl; do
            printf '%-8s ' "$t"; command -v "$t" >/dev/null && "$t" --version 2>&1 | head -1 || echo "missing"
          done

      - name: Run polyglot audit
        run: ./scripts/polyglot-check.sh
