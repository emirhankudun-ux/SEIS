name: Unified Ecosystem Bridge

on:
  pull_request:
    paths:
      - 'content/ecosystem/unified-bridge.json'
      - 'scripts/check-unified-ecosystem-bridge.mjs'
      - 'docs/architecture/UNIFIED_ECOSYSTEM_BRIDGE.md'
      - '.github/workflows/unified-ecosystem-bridge.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: node scripts/check-unified-ecosystem-bridge.mjs
