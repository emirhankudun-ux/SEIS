name: Unified Ecosystem Bridge

on:
  pull_request:
    paths:
      - 'content/ecosystem/unified-bridge.json'
      - 'scripts/check-unified-ecosystem-bridge.mjs'
      - 'docs/architecture/UNIFIED_ECOSYSTEM_BRIDGE.md'
      - '.github/workflows/unified-ecosystem-bridge.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-unified-ecosystem-bridge.mjs
