name: SEIS Workspace Session Planner

on:
  pull_request:
    paths:
      - 'packages/seis-workspace-planner/**'
      - 'scripts/check-seis-workspace-session-planner.mjs'
      - 'scripts/seis-workspace-session.mjs'
      - 'test/seis-workspace-session-planner.test.mjs'
      - 'docs/architecture/SEIS_WORKSPACE_SESSION_PLANNER.md'
      - '.github/workflows/seis-workspace-session-planner.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node --test test/seis-workspace-session-planner.test.mjs
      - run: node scripts/check-seis-workspace-session-planner.mjs
