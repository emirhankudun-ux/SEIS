name: SEIS AI

on:
  push:
    branches: [ main ]
    paths:
      - 'packages/seis-ai/**'
      - 'apps/web/**'
      - '.mcp.json'
      - '.github/workflows/seis-ai.yml'
  pull_request:
    paths:
      - 'packages/seis-ai/**'
      - 'apps/web/**'
      - '.mcp.json'
      - '.github/workflows/seis-ai.yml'

jobs:
  audit-and-test:
    name: SEIS AI audit and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: packages/seis-ai/package-lock.json

      # The audit CLI is dependency-free — run it before installing anything
      # so a broken lockfile can never mask a broken site.
      - name: Web audit (seis-check)
        run: node packages/seis-ai/bin/seis-check.mjs

      - name: Install seis-ai dependencies
        run: npm ci
        working-directory: packages/seis-ai

      - name: Unit + MCP smoke tests
        run: npm test
        working-directory: packages/seis-ai
