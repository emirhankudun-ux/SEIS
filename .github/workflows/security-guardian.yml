name: 🛡️ SEIS Guardian Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Her gün saat 02:00'da otomatik tarama
    - cron: '0 2 * * *'

jobs:
  security-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # Tüm geçmişi getir (gitleaks için gerekli)

      - name: Install GitLeaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          tar -xzf "${GITLEAKS_ARCHIVE}"
          sudo mv gitleaks /usr/local/bin/
          rm "${GITLEAKS_ARCHIVE}"

      - name: Run GitLeaks Scan
        run: |
          echo "🔍 SEIS Guardian: Tüm geçmiş taranıyor..."
          if gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 2; then
            echo "✅ Güvenlik Taraması Başarılı!"
          else
            echo "🚨 Kritik Güvenlik İhlali Tespit Edildi!"
            exit 1
          fi

      - name: Setup Node for dependency audit
        if: always()
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Dependency Audit (NPM)
        if: always()
        run: |
          # Audit every tracked lockfile, not just the root one. packages/seis-ai
          # has its own package-lock.json; auditing only the root meant its
          # advisories (including SSRF/trust-boundary highs in production deps of
          # the MCP server) were never reported at all.
          set -u
          failed=0
          audited=0
          while IFS= read -r lock; do
            dir="$(dirname "$lock")"
            echo "::group::npm audit — ${dir}"
            audited=$((audited + 1))
            if ! (cd "$dir" && npm ci --ignore-scripts); then
              echo "❌ npm ci failed in ${dir}"
              failed=$((failed + 1))
              echo "::endgroup::"
              continue
            fi
            if (cd "$dir" && npm audit --audit-level=high); then
              echo "✅ ${dir}: no high-or-above advisories"
            else
              echo "🚨 ${dir}: high-or-above advisories found"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done < <(git ls-files '*package-lock.json' | grep -vE '(^|/)node_modules/')

          if [ "$audited" -eq 0 ]; then
            echo "🚨 No lockfile was audited — the audit step is not doing its job."
            exit 1
          fi
          echo "Audited ${audited} lockfile(s); ${failed} with findings."
          # This gate enforces. It previously ended in `|| true`, which is why the
          # advisories above went unnoticed for months: they were reported and
          # then discarded. Threshold stays at --audit-level=high (moderate and
          # low are reported but do not block).
          [ "$failed" -eq 0 ]

      - name: Dependency Audit (Python)
        if: always()
        run: |
          # npm is not the only dependency ecosystem here.
          # server/cloud/ssh-ai-shell is a network-facing FastAPI/uvicorn/websockets
          # service with install.sh and systemd units -- i.e. something meant to be
          # deployed on a host -- and until now nothing scanned its dependencies at
          # all. It was clean when this step was added (pip-audit: "No known
          # vulnerabilities found"), which is exactly why it is a safe moment to
          # start enforcing rather than a reason to skip it.
          set -u
          files="$(git ls-files '*requirements*.txt' | grep -vE '(^|/)node_modules/' || true)"
          if [ -z "$files" ]; then
            echo "No tracked requirements file; nothing to audit."
            exit 0
          fi
          # Pinned so the tool itself is reproducible, matching how this workflow
          # pins gitleaks and its actions.
          python3 -m pip install --quiet --disable-pip-version-check pip-audit==2.10.1
          failed=0
          while IFS= read -r req; do
            echo "::group::pip-audit — ${req}"
            if python3 -m pip_audit -r "$req" --progress-spinner off; then
              echo "✅ ${req}: no known vulnerabilities"
            else
              echo "🚨 ${req}: known vulnerabilities found"
              failed=$((failed + 1))
            fi
            echo "::endgroup::"
          done <<EOF
          $files
          EOF
          # Known weakness this cannot fix: these requirements use unpinned '>='
          # specifiers with no lockfile, so what actually installs drifts over
          # time and this audit is only as reproducible as PyPI on the day it
          # runs. Pinning them (or adding a lockfile) is the real follow-up.
          [ "$failed" -eq 0 ]

  v14-compliance:
    name: V14 Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check Documentation Presence
        run: |
          echo "📄 Dokümantasyon Kontrolü..."
          files=("README.md" "SECURITY.md" "CONTRIBUTING.md")
          missing=0
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Eksik: $file"
              ((missing++))
            else
              echo "✅ Mevcut: $file"
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "⚠️ $missing adet kritik dokümantasyon dosyası eksik."
          fi

      - name: Design System Validation
        run: |
          echo "🎨 Tasarım Sistemi Kontrolü..."
          if [ -f "apps/web/src/styles/design-system.css" ]; then
            echo "✅ Tasarım sistemi dosyası mevcut."
          else
            echo "⚠️ Tasarım sistemi dosyası bulunamadı."
          fi

  summary:
    name: Security Summary
    needs: [security-scan, v14-compliance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🛡️ SEIS Güvenlik ve Uyumluluk Raporu" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Durum |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| V14 Compliance | ${{ needs.v14-compliance.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.security-scan.result }}" == "failure" ]; then
            echo "🚨 **KRİTİK:** Güvenlik taramasında ihlal tespit edildi!" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ Tüm güvenlik kontrolleri başarılı." >> $GITHUB_STEP_SUMMARY
          fi
