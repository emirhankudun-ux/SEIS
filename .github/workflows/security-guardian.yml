name: 🛡️ SEIS Guardian Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Her gün saat 02:00'da otomatik tarama
    - cron: '0 2 * * *'

permissions:
  contents: read

jobs:
  security-scan:
    name: Secret & Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # Tüm geçmişi getir (gitleaks için gerekli)
          persist-credentials: false

      - name: Install checksum-verified Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_ARCHIVE="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          GITLEAKS_INSTALL_DIR="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${GITLEAKS_INSTALL_DIR}"
          curl --fail --show-error --silent --location \
            --output "${RUNNER_TEMP}/${GITLEAKS_ARCHIVE}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${GITLEAKS_ARCHIVE}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${GITLEAKS_ARCHIVE}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${GITLEAKS_ARCHIVE}" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${GITLEAKS_INSTALL_DIR}/gitleaks"
          echo "${GITLEAKS_INSTALL_DIR}" >> "${GITHUB_PATH}"

      - name: Run redacted Gitleaks scan
        run: bash scripts/security/scan-secrets.sh

      - name: Setup Node for dependency audit
        if: always()
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Dependency Audit (NPM)
        if: always()
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high --ignore-scripts

  v14-compliance:
    name: V14 Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check Documentation Presence
        run: |
          echo "📄 Dokümantasyon Kontrolü..."
          files=("README.md" "SECURITY.md" "CONTRIBUTING.md")
          missing=0
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Eksik: $file"
              missing=$((missing + 1))
            else
              echo "✅ Mevcut: $file"
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "❌ $missing adet kritik dokümantasyon dosyası eksik."
            exit 1
          fi

      - name: Setup Node for boundary validation
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Validate security boundary
        run: node scripts/check-security-boundary.mjs

  summary:
    name: Security Summary
    needs: [security-scan, v14-compliance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🛡️ SEIS Güvenlik ve Uyumluluk Raporu" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test | Durum |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret Scan | ${{ needs.security-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| V14 Compliance | ${{ needs.v14-compliance.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.security-scan.result }}" == "success" ] && [ "${{ needs.v14-compliance.result }}" == "success" ]; then
            echo "✅ Yapılandırılmış kontroller başarıyla tamamlandı." >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Configured exceptions remain in effect; issue #129 is open and excluded historical content is not resolved by this result." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🚨 **KRİTİK:** Güvenlik veya uyumluluk kontrolü başarıyla tamamlanmadı." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
