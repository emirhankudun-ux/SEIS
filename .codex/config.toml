#:schema https://developers.openai.com/codex/config-schema.json

# ECC Tools generated Codex baseline
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.memory]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--extension"]

[mcp_servers.sequential-thinking]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sequential-thinking"]

[features]
multi_agent = true

[agents]
max_threads = 6
max_depth = 1

[agents.explorer]
description = "Read-only codebase explorer for gathering evidence before changes are proposed."
config_file = "agents/explorer.toml"

[agents.reviewer]
description = "PR reviewer focused on correctness, security, and missing tests."
config_file = "agents/reviewer.toml"

[agents.docs_researcher]
description = "Documentation specialist that verifies APIs, framework behavior, and release notes."
config_file = "agents/docs-researcher.toml"

[agents.architect]
description = "SEIS architecture sub-agent for system boundaries, ADR candidates, and integration fit."
config_file = "agents/architect.toml"

[agents.ai_systems]
description = "AI systems sub-agent for model router, prompt engine, eval, and provider-boundary analysis."
config_file = "agents/ai-systems.toml"

[agents.backend]
description = "Backend sub-agent for FastAPI, service, route, storage, and API contract review."
config_file = "agents/backend.toml"

[agents.frontend]
description = "Frontend sub-agent for browser UI, interaction states, responsive behavior, and accessibility review."
config_file = "agents/frontend.toml"

[agents.ui_ux]
description = "UI/UX sub-agent for premium, calm, Apple-first interface review."
config_file = "agents/ui-ux.toml"

[agents.website_builder]
