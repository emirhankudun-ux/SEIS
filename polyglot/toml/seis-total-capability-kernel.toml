[apple]
languages = ["Swift", "SwiftUI", "Objective-C", "Objective-C++", "AppleScript", "Metal Shading Language"]

[android]
languages = ["Kotlin", "Java", "XML", "Gradle", "C++", "Rust", "Go", "SQL"]

[windows]
languages = ["C#", "F#", "PowerShell", "Batch", "C++", "Rust", "Go", "T-SQL", "MSBuild", "SQL"]

[market]
required_files = ["README.md", "CODE_OF_CONDUCT.md", "CONTRIBUTING.md", "LICENSE", "SECURITY.md", "CONTRIBUTORS.md"]
required_posture = ["clear value", "safe contribution", "security reporting", "MIT clarity", "Codex and Claude attribution", "main-first governance"]
