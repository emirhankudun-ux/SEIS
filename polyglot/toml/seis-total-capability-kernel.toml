[id]
name = "seis-total-capability-kernel"
date = "2026-06-11"
canonical_branch = "main"
mode = "aggressive-capability-focus-without-new-js-python"

[runtime]
install_policy = "Install only for real product need, owner, validation path, storage budget, and rollback."
