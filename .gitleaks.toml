title = "SEIS Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic redaction test fixtures that intentionally exercise fake token redaction"
condition = "AND"
paths = [
  '''packages/seis-ai/test/redaction\.test\.mjs''',
]
regexTarget = "line"
regexes = [
  '''api_key=sk-[0-9a-f]{16}''',
  '''token: ghp_xxx[0-9a-z]{15}''',
  '''sk-[0-9a-f]{16} should be hidden''',
]

[[allowlists]]
description = "Legacy generated source aggregation is not an authoritative source file; scan source inputs instead"
paths = [
  '''sources/github-unified-source/_generated/github-code-bundle\.txt''',
]

[[allowlists]]
description = "Technology stack labels around Spring Boot and REST APIs are not credentials"
condition = "AND"
paths = [
  '''content/development/seis-agent-fullstack-production-roadmap\.json''',
]
regexTarget = "line"
regexes = [
  '''Spring Boot.*REST APIs.*microservices''',
]

[[allowlists]]
description = "Historic browser-local storage key for the removed five-year ledger route is not a credential"
condition = "AND"
paths = [
  '''apps/web/seis-five-year-ledger\.js''',
]
regexTarget = "line"
regexes = [
  '''STORAGE_KEY = "seis\.evolution-ledger\.v1"''',
]
