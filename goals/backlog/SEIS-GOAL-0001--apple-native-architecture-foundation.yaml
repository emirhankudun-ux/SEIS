risks:
  - id: SEIS1-RISK-001
    description: Architecture documentation may drift from the actual SwiftPM manifest.
    likelihood: medium
    impact: high
    owner: native-apple
    mitigation: Compare the package contract and documentation in deterministic checks with adversarial fixtures.
    trigger: A platform, product, target, or dependency changes without the contract, ADR, and platform map changing.
    contingency: Fail the gate and keep the Goal proposed until all contracts agree.
    status: open
  - id: SEIS1-RISK-002
    description: Existing experimental package surfaces may be mistaken for stable released Apple applications.
    likelihood: medium
    impact: high
    owner: product-strategy
    mitigation: Record current and planned surfaces separately and require explicit maturity labels and non-claims.
    trigger: Documentation calls an iPadOS, iOS, or released macOS application available without runtime evidence.
    contingency: Revert the claim, retain prototype or planned maturity, and require platform-specific evidence.
    status: open
  - id: SEIS1-RISK-003
    description: Architecture work may expand into an unreviewable native implementation or web rewrite.
    likelihood: medium
    impact: high
    owner: lead-architect
    mitigation: Restrict the pull request to the declared specification, validator, test, workflow, and package-script paths.
    trigger: Production Swift, app UI, provider, credential, deployment, signing, or web behavior enters the diff.
    contingency: Remove the unrelated change and create a child Goal with independent acceptance and rollback.
    status: open
  - id: SEIS1-RISK-004
    description: The four-digit schema-v2 Goal ID may be confused with legacy SEIS-GOAL-001.
    likelihood: medium
    impact: medium
    owner: goal-tracking
    mitigation: State that SEIS-GOAL-0001 is not an alias, migration, or replacement for the legacy AI Core record.
    trigger: A document or generated view maps the two identifiers to one capability.
    contingency: Block promotion and repair the reference before review.
    status: open
  - id: SEIS1-RISK-005
    description: The Apple branch may be reviewed against the wrong base and expose unrelated security-stack changes as Apple scope.
    likelihood: medium
    impact: high
    owner: lead-architect
    mitigation: Open the draft pull request against security/ecosystem-local-secret-boundary and record the post-merge retarget order.
    trigger: The Apple pull request diff includes the four ECO-GOAL-0002 security commits or targets main before its stacked dependencies merge.
    contingency: Change only the pull-request base after dependency merges, re-audit the diff, and rerun all required checks; do not rewrite shared history.
    status: open
  - id: SEIS1-RISK-006
    description: Declarative ready labels in existing Swift contracts may be mistaken for verified CloudKit, persistence, provider, build, or release capability.
    likelihood: high
    impact: high
    owner: product-strategy
    mitigation: Classify current labels as prototype metadata and require distinct evidence-backed operational states in a child Goal.
    trigger: A UI, document, Goal, or release decision uses aggregate ready booleans as runtime or release proof.
    contingency: Revert the capability claim, keep the affected gate open, and require planned/configured/verified/unavailable/failed evidence before promotion.
    status: open

rollback:
  strategy: revert
  steps:
    - Revert the focused Apple-platform architecture commit.
    - Restore the previous strategy, documentation index, ignore rules, package scripts, and Foundation workflow.
    - Leave the existing Swift package and all application behavior unchanged.
  data_migration_required: false

github:
  issue_required: true
  branch_required: true
  commit_required: true
  pull_request_required: true
  release_note_required: false
  suggested_branch: apple/seis-native-architecture-foundation
  suggested_commit: 'docs(apple): define the SEIS native architecture foundation'
  issue_url: https://github.com/emirhankudun-ux/SEIS/issues/181
