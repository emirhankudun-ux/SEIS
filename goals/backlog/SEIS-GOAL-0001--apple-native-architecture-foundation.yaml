schema_version: 2

id: SEIS-GOAL-0001
project: seis
program: apple-platform
initiative: native-architecture-foundation
parent_goal: null

title: Ratify the SEIS Apple-native architecture foundation
summary: >-
  Convert the existing Apple-platform direction and SwiftPM package surface
  into one reviewed architecture decision, exact platform and package map,
  web-demo boundary, build and test strategy, and deterministic drift gate
  without implementing new native product features.

