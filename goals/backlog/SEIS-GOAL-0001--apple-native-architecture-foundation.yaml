    status: failed
    command: >-
      swift build --disable-sandbox --package-path
      packages/seis_platform_swift --scratch-path
      /tmp/seis-swift-build-20260713-final --target SeisPlatformKit
    exit_code: 130
    artifact: null
  - id: SEIS1-EVIDENCE-007
    type: compatibility-validation
    description: Ecosystem schema, adversarial fixtures, syntax, and diff checks pass with the proposed Apple Goal present.
    status: passed
    command: >-
      npm run check:ecosystem-foundation && npm run test:ecosystem-foundation &&
      node --check scripts/check-seis-apple-platform-architecture.mjs &&
      node --check scripts/test-seis-apple-platform-architecture.mjs &&
