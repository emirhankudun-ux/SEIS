platforms:
  - macos
  - ipados
  - ios
  - web
  - repository
  - github

architecture_layers:
  - presentation
  - application
  - domain
  - data
  - infrastructure
  - integration
  - observability
  - governance

security_classification: public-safe
privacy_impact: none

requirements:
  - A proposed ADR defines macOS, iPadOS, iOS, visionOS-research, and web roles without claiming unimplemented applications.
  - The platform map inventories current SwiftPM platforms, products, targets, dependencies, and ownership separately from planned surfaces.
  - The current SeisPlatformKit domain, application/runtime, data/infrastructure, observability, and conditional Apple-presentation layers are recorded, with separation deferred to focused child Goals before stable maturity.
  - The current SeisAppleNativeShell presentation, application state/routing, scenario orchestration, resource-loading, local-process integration, and observability responsibilities are recorded rather than described as presentation-only.
  - Web remains the no-key public demo and onboarding surface rather than the long-term architectural center.
  - The build and test strategy names exact portable, Darwin SwiftPM, accessibility, performance, privacy, and release evidence required for later implementation.
  - A deterministic checker rejects drift between Package.swift, the machine-readable contract, ADR, platform map, strategy, Goal, and CI invocation.
  - Existing ready labels are classified as declarative prototype metadata rather than runtime, build, provider, CloudKit, or release proof.
  - Toolchain unavailability or skipped native tests remains explicit and cannot satisfy the engineering gate.

non_goals:
  - Adding or changing production Swift, SwiftUI, AppKit, UIKit, Core Data, CloudKit, or Metal implementation.
  - Creating an Xcode project or standalone macOS, iPadOS, iOS, or visionOS application.
  - Changing the web demo, native-shell runtime behavior, AI providers, MCPs, SSH, deployment, signing, or secrets.
  - Adding dependencies or changing SwiftPM minimum platform versions.
  - Migrating, renumbering, or aliasing legacy SEIS-GOAL-001.

acceptance_criteria:
  - The ADR, contract, and platform map match Package.swift name SeisPlatformKit, macOS 13 and iOS 16 minimums, two products, three targets, and zero external dependencies.
  - The exact manifest gate rejects added or removed platforms, products, targets, target dependencies, resources, and external package dependencies.
  - The map identifies the conditional SwiftUI, AppKit, and UIKit continuation surface inside SeisPlatformKit as current technical debt rather than claiming domain and presentation are already separated.
  - The map records current application/runtime, Core Data/infrastructure, observability, and overloaded readiness semantics instead of reducing the debt to presentation alone.
  - The map records the executable target's mixed presentation, application, resource, local-process, and telemetry layers as prototype debt.
  - Current evidence identifies SeisPlatformKit and SeisAppleNativeShell as existing package surfaces without describing them as stable released applications.
  - macOS is the primary native Command Center; iPadOS and iOS remain planned review and companion roles; visionOS remains research-only.
  - The iPadOS role explains that SwiftPM currently represents compatibility through the iOS platform declaration and does not claim a separate app target.
  - The web boundary preserves no-key demo, onboarding, public documentation, and GitHub showcase behavior.
  - Negative fixtures prove that platform, package, product, target, maturity, web-boundary, Goal-status, and validation-command drift is rejected.
  - A macOS CI lane describes the package, builds both the library and SeisAppleNativeShell product, and runs all package tests.
  - Focused architecture checks, ecosystem validation, Foundation validation, platform-kernel validation, and git diff checks pass.
  - Swift package tests pass on a verified Darwin Swift toolchain; an interrupted, unavailable, or skipped toolchain keeps the engineering gate open.
  - The pull-request diff contains no production Swift source, application UI, provider, credential, deployment, signing, or data-migration change.

definition_of_ready:
  - ECO-GOAL-0001, ECO-GOAL-0002, and ECO-GOAL-0003 are completed or archived with canonical evidence.
  - The SEIS project manifest is present on canonical main and ADR-0002 ownership is accepted or replaced.
  - A clean non-default SEIS branch can be created from the canonical reviewed base.
  - The current SwiftPM manifest and native documentation have been audited without changing implementation.
  - A Darwin Swift toolchain or explicit external native-test evidence path is available.

definition_of_done:
  - The focused ADR, platform map, contract, strategy update, checker, negative tests, and CI invocation are committed in one pull request.
  - Every acceptance criterion has reproducible local or remote evidence.
  - Swift package test evidence is recorded from a verified Darwin toolchain.
  - Required quality gates pass and the proposed ADR receives accountable human review.
  - Issue, branch, substantive commit, pull request, risks, rollback, failed or skipped checks, and remaining implementation gaps are recorded.
  - No production native source, application behavior, provider, secret, deployment, signing, or migration is changed.

dependencies:
  - ECO-GOAL-0001
  - ECO-GOAL-0002
  - ECO-GOAL-0003

blocked_by: []

related_goals: []

