  - deterministic architecture drift checker
  - adversarial drift fixtures
  - pull-request CI evidence

notes:
  - This schema-v2 ID is distinct from legacy SEIS-GOAL-001 and must not be treated as its alias or migration.
  - Package.swift is a read-only validation input in this Goal; changing it requires a child implementation Goal.
  - Proposed status must not advance to planned until all three ecosystem dependencies satisfy Definition of Ready.
  - Swift build or test interruption, skipping, or toolchain unavailability is disclosed evidence, not a passing engineering result.
  - This Goal establishes architecture truth only; it does not claim released native applications.
  - The branch is stacked on security/ecosystem-local-secret-boundary at b9155025; its draft pull request must use that branch as the base.
  - After ECO-GOAL-0003 and ECO-GOAL-0002 merge in order, retarget this draft to canonical main, re-audit the diff, and rerun every required check before promotion or merge.
  - Proposed ADR and Goal status are intentionally enforced only for this draft specification; it is not merge-ready while its Definition of Ready dependencies remain open.
