      npm run check:security-boundary && npm run test:security-boundary &&
      npm run check:goal-tracking && npm run check:open-source-governance
    exit_code: 0
    artifact: .github/workflows/foundation-check.yml
  - id: SEIS1-EVIDENCE-009
    type: native-package-inventory
    description: >-
      SwiftPM described the package from a clean scratch directory and confirmed
      Swift tools 6.0, macOS 13, iOS 16, no external dependencies, two products,
      and the library, executable, and test targets recorded by the contract.
    status: passed
    command: >-
      swift package --disable-sandbox --package-path
      packages/seis_platform_swift --scratch-path
