    status: passed
    command: npm run check:seis-apple-platform-architecture && npm run test:seis-apple-platform-architecture
    exit_code: 0
    artifact: scripts/test-seis-apple-platform-architecture.mjs
  - id: SEIS1-EVIDENCE-004
    type: native-package-validation
    description: Swift package describe, library build, executable-product build, and tests pass on a verified Darwin Swift toolchain.
    status: pending
    command: >-
      swift package --package-path packages/seis_platform_swift describe &&
