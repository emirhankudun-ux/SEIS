notes:
  - github.commit_sha records the substantive ECO-GOAL-0001 bootstrap implementation commit; later evidence-only or ECO-GOAL-0003 hardening commits may be newer.
  - This first slice does not claim ecosystem-wide completion.
  - Eleni-Neferi and Pantechnoesis remotes were observed through an authenticated read-only connector and are canonical by repository identity, but their manifests are still missing.
  - Scope expanded to CI and an ADR because both are explicit Definition of Done and ownership-decision requirements.
  - All seven pull-request workflows passed; the Goal remains blocked only on the private manifests, publication authorization, complete ownership inventory, and architecture decision.
