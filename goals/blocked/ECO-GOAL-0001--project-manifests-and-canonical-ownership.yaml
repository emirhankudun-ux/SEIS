architecture_layers:
  - governance
  - integration

security_classification: public-safe
privacy_impact: none

requirements:
  - Every canonical repository contains project.ecosystem.yaml.
  - Every shared module has exactly one canonical owner repository.
  - Remote identity, visibility, local-worktree state, and manifest state are explicit and evidence-bound.
  - External manifest validation uses repository-specific commit, pull-request, and CI evidence instead of sibling filesystem paths.
  - Private operational identifiers are replaced by a public-safe attestation and SHA-256 revision digests in the public SEIS repository.
  - Manifest state changes follow an explicit pending-to-review-to-validated-or-rejected history.
  - Every consumer mapping records repository, distribution mode, compatibility, status, and evidence.
  - The separately paired Greek repository target is confirmed through least-privilege evidence or explicitly deferred before Goal completion.

non_goals:
  - Moving all production code into one repository.
  - Enabling bidirectional repository synchronization.

acceptance_criteria:
  - Project manifests validate against the approved schema.
  - The ownership registry lists an exact non-overlapping proposed inventory for every module observed in the current repository audit.
  - Synchronization direction is explicit for each owned module.
  - Duplicate module ownership or overlapping paths within a canonical repository are rejected by validation.
  - Case-folded ownership collisions are rejected for case-insensitive worktrees.
  - Repository observation, local-worktree validity, and manifest validation remain separate evidence states.
  - Observed consumer mappings require durable evidence and unsafe or duplicate mappings are rejected.

definition_of_ready:
  - Valid fresh clones and canonical HEADs are inventoried without machine-specific paths.
  - A clean isolated SEIS worktree exists on a non-default branch.
  - Canonical remote identity and visibility are observed read-only with an explicit evidence method and date.
  - No destructive repository move is required.

definition_of_done:
  - SEIS, Eleni-Neferi, and Pantechnoesis each have a validated manifest in their observed canonical repositories.
  - The ownership registry covers all shared modules with no conflicts.
  - Validation runs in CI and passes.
  - A focused pull request includes evidence, risks, and rollback instructions.

dependencies:
  - ECO-GOAL-0003
blocked_by:
  - type: repository-content
    reference: seis
    reason: The SEIS manifest revision has revision-bound public PR and successful CI evidence, but PR 177 remains open and the observed canonical main revision lacks project.ecosystem.yaml.
    unblock_condition: Complete human review, merge through repository policy, refresh the observed main revision, and promote the manifest from review to validated.
  - type: repository-content
    reference: eleni-neferi
    reason: A public-safe attestation records a digest-bound open draft and successful repository-local CI observation, but canonical main lacks project.ecosystem.yaml.
    unblock_condition: Complete human review, merge through repository policy, refresh the observed main revision, and promote the manifest from review to validated.
  - type: repository-content
    reference: pantechnoesis
    reason: A public-safe attestation records a digest-bound open draft and successful required/global repository-local CI observation, but canonical main lacks project.ecosystem.yaml; the optional paired-Greek check was skipped.
    unblock_condition: Complete human review, merge through repository policy, refresh the observed main revision, and promote the manifest from review to validated; verify the paired Greek repository separately.
  - type: inventory
    reference: shared-module-inventory
    reason: The fresh-clone audit produced an exact non-overlapping proposed inventory, but consumer distribution remains planned and ADR-0002 still requires human architecture review.
    unblock_condition: Review the proposed paths and structured consumer mappings, add evidence for any observed distribution, and accept or revise ADR-0002.
  - type: repository-identity
    reference: paired-greek-identity-repository
    reason: Authenticated read-only lookup did not find the requested canonical Greek target. A private ambiguous candidate exists, but its identity alignment is unverified and its identifier is withheld from the public registry.
    unblock_condition: The accountable human confirms the exact canonical target or explicitly defers Greek publication; any selected candidate then receives a least-privilege identity and visibility inspection before ownership is recorded.
