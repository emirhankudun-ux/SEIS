risks:
  - id: ECO-RISK-001
    description: Two repositories may claim canonical ownership of the same module or path.
    likelihood: medium
    impact: high
    owner: lead-architect
    mitigation: Reject duplicate module identifiers and owned paths in deterministic validation.
    trigger: A second ownership entry reuses an existing module id or path.
    contingency: Keep the conflicting entry proposed and require an ADR before promotion.
    status: open
  - id: ECO-RISK-002
    description: Uncommitted sibling-worktree manifests may be mistaken for validated canonical repository content.
    likelihood: medium
    impact: high
    owner: repository-hygiene
    mitigation: Separate worktree observation from manifest validation and require revision-bound public evidence or a checked public-safe private attestation.
    trigger: External validation is proposed using only a local sibling path or uncommitted file.
    contingency: Keep the manifest pending until its canonical repository supplies durable review and CI evidence that can be represented without exposing private operational identifiers.
    status: open
  - id: ECO-RISK-003
    description: A manifest may claim public visibility for a repository that is currently private.
    likelihood: medium
    impact: high
    owner: security
    mitigation: Require manifest visibility to match session-observed repository metadata before publication.
    trigger: A proposed manifest sets security.public_repo to true for Eleni-Neferi or Pantechnoesis.
    contingency: Reject the manifest and retain the repository's private boundary until the owner changes visibility explicitly.
    status: open

