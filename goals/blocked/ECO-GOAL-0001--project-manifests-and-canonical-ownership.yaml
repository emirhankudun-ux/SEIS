  - architecture
  - governance
  - repository-hygiene

priority: critical
status: blocked
maturity: specification
confidence: medium

owner_agent: lead-architect
accountable_human: project-owner
supporting_agents:
  - repository-hygiene
  - documentation
  - security

horizon: now
start_after: null
target_window:
  start: '2026-07-12'
  end: null

scope:
  repositories:
    - seis
    - eleni-neferi
    - pantechnoesis
  paths:
    - AGENTS.md
    - .github/workflows/foundation-check.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - project.ecosystem.yaml
    - schemas/project-ecosystem.schema.json
    - schemas/repository-ownership.schema.json
    - schemas/ecosystem-goal.schema.json
    - data/repository-ownership.yaml
    - docs/ECOSYSTEM_GOAL_TRACKING.md
    - docs/REPOSITORY_OWNERSHIP.md
