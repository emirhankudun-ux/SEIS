id: ECO-GOAL-0001
project: ecosystem
program: governance
initiative: repository-foundation
parent_goal: null

title: Establish project manifests and canonical repository ownership
summary: >-
  Give each canonical ecosystem repository a machine-readable identity and assign
  every shared module exactly one canonical owner without moving code or
  creating bidirectional synchronization.

