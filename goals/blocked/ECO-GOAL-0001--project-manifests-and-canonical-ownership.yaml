    - scripts/test-ecosystem-foundation.rb
    - package.json

canonical_owner_repo: seis

platforms:
  - repository
  - github

architecture_layers:
  - governance
  - integration

security_classification: public-safe
privacy_impact: none

requirements:
  - Every canonical repository contains project.ecosystem.yaml.
  - Every shared module has exactly one canonical owner repository.
  - Remote identity, visibility, local-worktree state, and manifest state are explicit and evidence-bound.

non_goals:
  - Moving all production code into one repository.
  - Enabling bidirectional repository synchronization.
  - Repairing, deleting, or replacing invalid Git metadata in this slice.

acceptance_criteria:
  - Project manifests validate against the approved schema.
  - The ownership registry lists every observed shared module.
  - Synchronization direction is explicit for each owned module.
  - Duplicate module ownership or overlapping paths within a canonical repository are rejected by validation.
  - Invalid local worktrees remain classified separately from session-observed canonical remotes.

definition_of_ready:
  - Candidate project roots are inventoried.
  - A clean isolated SEIS worktree exists on a non-default branch.
  - Canonical remote identity and visibility are observed read-only with an explicit evidence method and date.
  - No destructive repository move is required.

definition_of_done:
  - SEIS, Eleni-Neferi, and Pantechnoesis each have a validated manifest in their observed canonical repositories.
  - The ownership registry covers all shared modules with no conflicts.
  - Validation runs in CI and passes.
  - A focused pull request includes evidence, risks, and rollback instructions.

dependencies:
  - ECO-GOAL-0003
blocked_by:
  - type: repository-content
    reference: eleni-neferi
    reason: The canonical private repository was observed in the authenticated session, but project.ecosystem.yaml is absent and the local candidate is not a valid worktree.
    unblock_condition: Create a focused non-default branch in the canonical repository, add a private-accurate manifest, validate it, and obtain review.
  - type: repository-content
    reference: pantechnoesis
    reason: The canonical private repository was observed in the authenticated session, but project.ecosystem.yaml is absent and local candidates are not valid worktrees.
    unblock_condition: Obtain the repository-required publication authorization, create a focused non-default branch, add a private-accurate manifest, validate it, and obtain review.
  - type: inventory
    reference: shared-module-inventory
    reason: The current registry records the product-family ownership baseline but does not prove complete cross-repository shared-module coverage.
    unblock_condition: Inspect all three valid repositories and accept a complete module and consumer mapping through an ADR.
