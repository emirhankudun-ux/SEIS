schema_version: 2

id: SEIS-GOAL-0026
project: seis
program: public-plugin-governance
initiative: public-marketplace-local-cleanup
parent_goal: SEIS-GOAL-0024

title: Move active local SEIS plugin records from personal to the public SEIS Repo surface
summary: >-
  Provide a narrow, user-approved, reversible migration utility that plans and,
  only after explicit invocation, removes or disables active seis...@personal
  records in the local Codex configuration while retaining the canonical
  seis-ai-agent@seis-repo public default. The tool must not install every public
  bundle, remove source or cache directories, expose configuration values, or
  claim that a GUI refresh has occurred without direct evidence.

category:
  - plugins
  - migration
  - automation
  - security
  - testing
  - documentation

priority: high
status: review
maturity: prototype
confidence: medium

owner_agent: lead-architect
accountable_human: project-owner
supporting_agents:
  - security
  - testing-and-qa
  - documentation

horizon: now
start_after: null
target_window:
  start: 2026-07-22
  end: null

scope:
  repositories:
    - SEIS-plugin-root-20260715
  paths:
    - goals/active/SEIS-GOAL-0026--public-marketplace-local-cleanup.yaml
    - scripts/manage-seis-public-marketplace-switch.mjs
    - plugins/seis-core/test/public-marketplace-local-cleanup.test.mjs
    - docs/roadmap/SEIS_PUBLIC_MARKETPLACE_LOCAL_CLEANUP.md
    - package.json
  external_paths:
    - ~/.codex/config.toml

canonical_owner_repo: SEIS-plugin-root-20260715

platforms:
  - repository
  - cli
  - codex-plugin

architecture_layers:
  - governance
  - integration
  - security

security_classification: local-config-sensitive
privacy_impact: local-configuration-metadata-only

requirements:
  - keep seis-ai-agent@seis-repo enabled as the canonical public default before any personal-record change
  - provide a read-only plan that reports counts only and never emits configuration values or local paths
  - target only exact seis...@personal configuration tables
  - require explicit --apply and one explicit action before any local configuration write
  - verify a same-directory backup before changing the local configuration
  - write atomically and fail closed if the configuration changes during the operation
  - verify the requested postcondition and automatically restore the original configuration if verification fails
  - support a constrained rollback from a tool-owned same-directory backup
  - keep all non-SEIS plugin records, source directories, and cache directories unchanged
  - avoid network, provider, secret, GitHub, release, deployment, installation, and background-agent behavior
  - never bulk-enable the 33 optional public bundles

non_goals:
  - deleting plugin source folders or cache directories
  - bulk-installing or bulk-enabling public SEIS bundles
  - changing non-SEIS personal plugins
  - publishing local configuration content to the repository
  - restarting Codex or claiming a GUI result without manual evidence
  - automatic external configuration mutation from supervised Auto Mode

acceptance_criteria:
  - plan mode is read-only and detects personal/public SEIS record counts without leaking config contents
  - the utility refuses a migration when the canonical public SEIS-Agent is absent, disabled, duplicated, malformed, or ambiguous
  - remove mode deletes only matching personal SEIS configuration tables and proves no such table remains
  - disable mode changes only matching true enabled flags and proves none remain enabled
  - every actual write creates and verifies a tool-owned backup before replacement
  - apply mode is constrained to the default Codex config or a temporary test fixture
  - restore mode accepts only a same-directory backup generated by this utility
  - fixture tests cover plan, remove, disable, idempotence, failure, and restore flows
  - repository validation and focused tests pass before a local configuration apply is proposed

definition_of_ready:
  - the public capability-package goal has preserved one canonical public default and bounded optional bundles
  - a real local configuration is known to contain personal SEIS records and an enabled public canonical record
  - external configuration mutation has separate human approval and a rollback plan

definition_of_done:
  - focused script, tests, docs, and goal record are committed on the feature branch
  - read-only plan and fixture validation pass
  - any actual local apply has explicit approval, a verified backup, and post-apply configuration evidence
  - GUI appearance is reported only after manual refresh evidence
  - GitHub delivery remains a separately visible action

dependencies:
  - SEIS-GOAL-0024
  - SEIS-GOAL-0025
blocked_by: []
related_goals:
  - SEIS-GOAL-021
  - SEIS-GOAL-0024
  - SEIS-GOAL-0025

validation:
  commands:
    - node --check scripts/manage-seis-public-marketplace-switch.mjs
    - node --test plugins/seis-core/test/public-marketplace-local-cleanup.test.mjs
    - npm run check:seis-public-marketplace-local-cleanup
    - npm run plan:seis-public-marketplace-local-cleanup
    - npm run check:seis-repo-marketplace
    - git diff --check
  manual:
    - local configuration permission-boundary review
    - Codex UI refresh verification after an approved apply
  evidence:
    - read-only plan output
    - fixture migration and restore test output
    - explicit local apply output with only aggregate counts and backup filename

quality_gates:
  architecture: required
  design: not-applicable
  security: required
  accessibility: not-applicable
  performance: not-applicable
  documentation: required
  testing: required

risks:
  - id: RISK-0026-001
    description: Removing a configuration entry without a public default could leave the user without a usable SEIS surface.
    likelihood: low
    impact: high
    owner: security
    mitigation: Refuse to proceed unless the exact canonical public SEIS-Agent record is uniquely present and enabled.
    trigger: The canonical public table is missing, duplicated, malformed, or disabled.
    contingency: Make no write and report the precondition failure.
    status: active
  - id: RISK-0026-002
    description: A concurrent Codex configuration update could be overwritten during migration.
    likelihood: medium
    impact: high
    owner: security
    mitigation: Verify file identity and digest immediately before atomic replacement.
    trigger: Device, inode, size, or digest changes after initial inspection.
    contingency: Abort without replacing the configuration; preserve the verified backup if one already exists.
    status: active
  - id: RISK-0026-003
    description: The Codex UI may cache a removed plugin entry until refresh or restart.
    likelihood: medium
    impact: medium
    owner: documentation
    mitigation: Do not delete caches; require manual refresh evidence before claiming UI completion.
    trigger: A removed configuration record remains visible after the first refresh.
    contingency: Preserve the backup and open a separate cache-behavior investigation rather than expanding this tool's scope.
    status: active
  - id: RISK-0026-004
    description: Local configuration content could contain unrelated private settings.
    likelihood: medium
    impact: high
    owner: lead-architect
    mitigation: Emit aggregate counts and backup filename only; never commit, print, or upload raw config text.
    trigger: A report or test attempts to serialize raw configuration content.
    contingency: Stop the operation, remove the unsafe output, and restore from backup if needed.
    status: active

rollback:
  strategy: restore-approved-backup
  steps:
    - identify the backup filename emitted by the approved apply
    - run the constrained --apply --restore command against that same local config
    - refresh Codex and verify the prior state manually
    - do not delete source or cache directories during rollback
  data_migration_required: false

github:
  issue_required: true
  branch_required: true
  commit_required: true
  pull_request_required: true
  release_note_required: false
  suggested_branch: plugins/seis-public-marketplace-local-cleanup
  suggested_commit: "feat(plugins): add public marketplace cleanup switch"

observability:
  metrics:
    - personal_seis_plugin_record_count
    - personal_seis_plugin_enabled_count
    - seis_repo_plugin_enabled_count
    - public_marketplace_cleanup_plan_success
    - public_marketplace_cleanup_apply_success
    - public_marketplace_cleanup_restore_success
  logs: []

outputs:
  - read-only local migration plan
  - explicit backup-backed remove and disable modes
  - constrained rollback path
  - fixture validation coverage
  - public-safe operational documentation

notes:
  - The public marketplace remains a bounded package experience: canonical SEIS-Agent first, then at most one optional bundle for a scoped task.
  - This goal does not make future or external configuration work automatic; each real apply is visible, approval-gated, and reversible.
  - A current approved local apply removed matching personal SEIS configuration tables after creating and verifying a same-directory backup; source and cache directories were not touched.
  - Codex UI refresh evidence remains a manual review gate and is not claimed by this repository record.
