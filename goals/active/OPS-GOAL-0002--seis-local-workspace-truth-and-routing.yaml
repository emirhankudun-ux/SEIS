notes:
  - This Goal grants no cleanup, repair, deletion, restore, move, stash, rebase, merge, commit, remote, branch, credential, or GitHub mutation authority for any discovered workspace.
  - The recorded counts are read-only observations at one evidence boundary, not permission to inspect or publish the affected file paths or contents.
  - The committed registry is an immutable historical evidence artifact, not an operational source of current routing authority, and does not replace the canonical repository ownership decision tracked by ECO-GOAL-0001.
  - 'Scoped requirement refinement (2026-07-14): implementation and adversarial review required exact Git and CI allowlists, local Git configuration rejection, linked-worktree reverse-pointer validation, capturedAt-bound live identity, executable schema fixtures, zero-eligible behavior, a Gitlink fail-closed boundary, and a clear separation between the shared schema, generic relationship validator, and frozen snapshot checker; this refinement narrows authority and does not expand candidate scope or permit cleanup.'
  - This Goal changes no Apple-native product code, provider or model routing, MCP configuration, SEIS Brain private content, or SEIS-SSH connection configuration.
  - A later cleanup or metadata-repair proposal requires its own Goal, exact scope, backup and rollback plan, human approval, and post-action validation.

