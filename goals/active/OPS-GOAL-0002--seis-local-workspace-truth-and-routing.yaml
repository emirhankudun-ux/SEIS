risks:
  - id: OPS2-RISK-001
    description: A public registry could leak personal absolute paths, local account names, host details, credential-bearing or local remote URLs, private file names, or other machine-specific identity.
    likelihood: high
    impact: critical
    owner: privacy
    mitigation: Allowlist public fields, use opaque stable identifiers, publish aggregate counts only, and reject path separators, home markers, host-like values, remote URLs, and unapproved free text.
    trigger: A generated or hand-edited artifact contains a machine-specific identifier or non-allowlisted field.
    contingency: Fail validation, prevent publication, remove the leaked value from the focused branch, and assess whether any exposed credential or private identity requires incident response.
    status: open
  - id: OPS2-RISK-002
    description: An ambiguous, dirty, non-Git, or incomplete workspace could be selected for writes and suffer data loss or history corruption.
    likelihood: high
    impact: critical
    owner: repository-hygiene
    mitigation: Require positive canonical identity, valid Git metadata, an allowed branch, a clean state, containment within the configured root, and explicit eligibility before returning a write route.
    trigger: More than one candidate is write-eligible at one observation boundary, an immutable capture is treated as current authority, or any ineligible live state receives a writable routing decision.
    contingency: Fail closed, keep all candidates read-only, and require a separate human-approved recovery decision.
    status: open
  - id: OPS2-RISK-003
    description: Aggregate state may drift after capture and make a previously accurate registry stale.
    likelihood: high
    impact: high
    owner: testing
    mitigation: Record a UTC observation boundary and evidence method, regenerate explicitly, and never silently reinterpret an immutable capture as live state.
    trigger: A read-only reconciliation differs from the captured state, counts, or eligibility decision.
    contingency: Keep writes disabled for the changed candidate, version the new evidence, rerun validation, and disclose the delta before review.
    status: open
  - id: OPS2-RISK-004
    description: Discovery could escape the configured workspace root through traversal or symlink behavior.
    likelihood: medium
    impact: critical
    owner: security
    mitigation: Canonicalize the configured root, reject traversal, do not follow directory symlinks, and test containment with adversarial fixtures.
    trigger: A discovered real path is outside the canonical root or a symlink is treated as a traversable workspace.
    contingency: Abort discovery without emitting the candidate and block the security gate until containment is restored.
    status: open
  - id: OPS2-RISK-005
    description: A structurally valid observation could be mistaken for a safe current route even when cross-field semantics, gitlink state, or snapshot freshness are unverified.
    likelihood: medium
    impact: critical
    owner: security
    mitigation: Validate every live observation with the generic semantic validator before stdout, allow zero eligible routes, block any gitlink or submodule presence, and reserve snapshot-specific assertions for the frozen checker.
    trigger: A live observation is emitted before semantic validation, a historical snapshot is used as current authority, or gitlink-bearing state receives a writable decision.
    contingency: Emit no observation, keep all routes blocked, correct the contract or implementation in a focused change, and rerun schema, generic, frozen, and adversarial validation.
    status: open

rollback:
  strategy: revert
  steps:
    - Revert the focused Goal, registry schema and snapshot, discovery and validation scripts, tests, workflow wiring, and documentation references.
    - Restore the prior static workspace-routing wording without changing any observed local workspace, Git metadata, branch, remote, or GitHub state.
    - Rerun the pre-existing ecosystem, Goal Tracking, workspace, governance, open-source, and diff-integrity checks.
  data_migration_required: false

