title: Establish redacted local workspace truth and non-destructive routing
summary: >-
  Replace ambiguous local SEIS folder selection with a public-safe, redacted,
  machine-validated historical registry and read-only live discovery contract
  that can identify an eligible focused worktree at one observation boundary,
  carries no continuing routing authority, and fails closed without authorizing
  cleanup.

