requirements:
  - Discover the four bounded candidate roles read-only from committed generic relative locators and the supplied task-worktree locator; discovery code must not directly open application or user content, Git may internally read contained working-tree content and status names while computing aggregate status, external-command and include-capable local Git configuration must be rejected before status inspection, and names, content, personal or resolved paths, credentials, raw configuration, and raw Git values must not be retained, persisted, or emitted.
  - Publish only opaque workspace identifiers, bounded state classifications, aggregate change counts, evidence times, and policy decisions in the registry; never publish personal absolute paths, account names, host details, credential-bearing or local remote URLs, or secret values.
  - Classify valid clean Git worktrees separately from dirty worktrees, non-Git folders, and roots with incomplete Git metadata.
  - Treat the committed registry as an immutable historical snapshot with zero write-eligible records and no current routing authority; each live discovery binds its timestamped dataset ID and per-record observation times to capturedAt, validates the complete observation semantically before stdout, may report zero eligible routes, and may identify at most one clean focused worktree as write-eligible at that observation only.
  - Route repository writes only after a new live verification and fail closed when identity, cleanliness, canonical ownership, containment, branch, Git metadata integrity, or gitlink and submodule state is uncertain; any observed gitlink or submodule presence is unverified and blocks writes.
  - Keep every discovered dirty, non-Git, incomplete, or otherwise ineligible candidate read-only until a separate human-approved recovery Goal authorizes a bounded action.
  - Execute the JSON Schema against the frozen snapshot, positive live observations, and negative structural and conditional fixtures; use the generic observation validator for cross-field and routing relationships and the frozen registry checker for snapshot-specific identity, count, digest, documentation, and CI assertions.
  - Validate registry schema, discovery determinism, redaction, path containment, unique identities, aggregate counts, zero-or-one live eligibility, routing invariants, gitlink fail-closed behavior, documentation references, and CI invocation.

non_goals:
  - Deleting, cleaning, restoring, moving, merging, rebasing, stashing, committing, or otherwise normalizing any discovered local workspace.
  - Repairing the direct SEIS folder that is not a Git worktree or the workspace root that contains incomplete Git metadata.
  - Changing remotes, credentials, branch protection, Git configuration, worktree registrations, default branches, or GitHub pull-request state.
  - Publishing personal absolute paths, local account names, private repository locations, host metadata, credential-bearing or local remote URLs, file names from untracked content, or any file contents.
  - Declaring a local candidate canonical solely because its folder name resembles SEIS.
  - Treating this repository-routing guard as model, provider, agent, MCP, or production deployment routing.

acceptance_criteria:
  - The registry and schema represent every in-scope observation through a public-safe opaque identifier and an allowed workspace-state classification.
  - The captured dirty candidate records exactly 158 modified, 865 deleted, and 93 untracked files at the declared observation boundary without exposing their paths or contents.
  - The direct SEIS folder is classified non-Git and the workspace root is classified incomplete-metadata rather than being treated as writable repositories.
  - The immutable capture records zero write-eligible worktrees and carries no current routing authority because the focused worktree's historical Gitlink state was not observed; a positive live fixture proves that a fully verified live observation may contain at most one eligible route, while zero is valid.
  - Every dirty, non-Git, incomplete, ambiguous, missing, wrong-origin, wrong-branch, detached, protected-branch, out-of-root, gitlink-bearing, or otherwise submodule-unverified live candidate is rejected from write routing.
  - Discovery defaults to observation only, executes only exact allowlisted Git inspection argument vectors, rejects unsafe local Git configuration and mismatched worktree reverse pointers, remains within the configured root without following an escaping symlink, assigns a capturedAt-derived live-observation dataset ID, and completes generic semantic validation before emitting stdout.
  - The executable shared schema rejects structural and semantic-shape drift, the generic validator rejects invalid cross-field relationships, and the frozen checker rejects changes to snapshot-specific candidates, counts, digest, documentation evidence, exact CI commands, or SHA-pinned actions.
  - Adversarial fixtures reject absolute-path leakage, user and host disclosure, duplicate identifiers, invalid counts, unknown states, path traversal, gitlink uncertainty, routing to ineligible workspaces, and documentation drift.
  - Canonical workspace-routing and governance documents consume the same registry terminology and disclose that no cleanup was authorized.
  - Ecosystem foundation, legacy Goal Tracking, workspace, governance, open-source, and diff-integrity checks remain green after the additive change.

definition_of_ready:
  - The repository constitution, project manifest, active ecosystem Goal dependency, and Goal schema have been read.
  - An isolated non-default SEIS worktree with zero aggregate changes existed at Goal start; the later final contract does not treat that historical status alone as write-eligibility evidence.
  - Read-only inspection has confirmed a materially dirty candidate, a direct non-Git SEIS folder, and incomplete Git metadata at the workspace root.
  - The work can produce a redacted registry and routing guard without cleaning or repairing any observed workspace.
  - No destructive or cleanup authorization is required for the scoped implementation.

definition_of_done:
  - The schema, redacted registry, read-only discovery command, fail-closed validator, and adversarial tests are committed on a focused branch.
  - Workspace routing, integration, iCloud-ingestion, status, index, backlog, and queue surfaces reference one consistent source of truth.
  - No public artifact contains personal absolute paths, account names, host details, credential-bearing or local remote URLs, credentials, private file names, or file contents; the canonical public GitHub URL may remain in the dedicated remote-configuration contract.
  - Applicable local and remote checks pass, skipped checks are disclosed, and independent security, privacy, architecture, and repository-safety findings are resolved or recorded.
  - A Goal-linked issue and focused draft pull request expose evidence, risks, and rollback without mutating any observed workspace.
  - The Goal remains incomplete until review evidence proves every required gate and GitHub delivery field.

