    - bundle_source_capability_coverage
    - duplicate_bundle_member_count
    - bundle_validation_success
  logs: []

outputs:
  - curated marketplace projection
  - bounded capability bundle packages
  - exact-once coverage validation
  - security-hardened local MCP runtime template
  - canonical SEIS-Agent public bundle selection guide and bounded recommendation tools
  - refreshed lifecycle closeout evidence for the generated bundle catalog
  - implementation and rollback documentation

notes:
  - Local implementation and validation are complete enough for review; public release and independent external-runner proof remain separate gates.
  - GitHub issue, pull request, publication, and release actions require current human approval.
  - The earlier 2026-07-22 usability increment used six starter paths, 19 journeys, and a 34-card projection; those values are retained only as historical context.
  - The current usability increment exposes ten general-plugin paths and a local deterministic finder that returns at most three candidates without adding internal-package cards, installing packages, exposing source terms, or accessing external services.
