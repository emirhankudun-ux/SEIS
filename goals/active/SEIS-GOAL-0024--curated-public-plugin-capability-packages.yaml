title: Curate the SEIS public marketplace into bounded capability packages
summary: >-
  Replace hundreds of individual discovery cards with ten concise general SEIS
  cards, led by the canonical SEIS-Agent and backed by thirty bounded internal
  packages, while retaining every public source package and preserving distinct
  SEIS, Eleni-Neferi, and Pantechnoesis capability boundaries.

