supporting_agents:
  - repository-hygiene
  - security
  - testing-and-qa
  - documentation

horizon: now
start_after: null
target_window:
  start: 2026-07-22
  end: null

scope:
  repositories:
    - SEIS-plugin-root-20260715
  paths:
