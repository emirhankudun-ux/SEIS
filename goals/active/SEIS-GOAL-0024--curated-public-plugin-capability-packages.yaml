canonical_owner_repo: SEIS-plugin-root-20260715

platforms:
  - repository
  - codex-plugin
  - mcp

architecture_layers:
  - governance
  - integration
  - security

security_classification: public-safe
privacy_impact: none

requirements:
  - keep SEIS-Agent as the only canonical default-install card
  - expose between 30 and 50 total public marketplace cards
  - retain every application and topic source package without deletion
  - map every retained application and topic source package to exactly one bundle
  - keep each bundle at no more than 15 source capabilities
  - preserve dedicated SEIS, Eleni-Neferi, and Pantechnoesis topic boundaries
  - keep bundle runtimes local, read-only, bounded, and free of network or secret access
  - reject undeclared files, directories, links, and cross-family duplicate members
  - validate runtime profiles against immutable generated bundle metadata
  - generate marketplace and bundle artifacts from reviewed source data
  - generate a public selection guide with a canonical default, six fast starter paths, and all curated journeys without adding marketplace cards
  - provide a local deterministic journey finder that returns at most three candidates from generated public metadata without installation or external access
  - recommend only one initial optional bundle for a known journey and fail closed on tampered guide data or unknown journey input
  - let the terminal installer turn one known journey into a plan-only canonical-plus-one-bundle selection while keeping the default canonical-only and requiring explicit --apply for external installation
  - keep marketplace card counts separate from retained source capability counts in every current contract
  - preserve historical wave snapshots while labeling them as historical rather than current distribution proof

non_goals:
  - deleting or physically merging retained source packages
  - bulk-installing every bundle or member package
  - publishing, pushing, signing, or deploying without current human approval
  - granting network, secret, cloud, GitHub-write, or destructive permissions
  - combining SEIS, Eleni-Neferi, and Pantechnoesis into one product identity

acceptance_criteria:
  - the generated marketplace contains 30 to 50 total cards, including one canonical card and 29 to 49 optional bundle cards
  - all 75 application packages and all 300 topic packages are covered exactly once
  - every bundle contains at least one and no more than 15 members
  - category and project boundaries are explicit in bundle metadata
  - generated plugin manifests pass the repository validator
  - bundle MCP input, output, metadata reads, and profile values are bounded and fail closed
  - generated bundle trees contain exactly the allowlisted files and directories
  - source packages remain present and no source directory is deleted
  - focused generation, freshness, marketplace, integration, and test checks pass
  - current project, catalog, install-state, permission, Apple/Swift, and continuity evidence consistently reports 34 cards and 380 retained source capabilities
  - the selection guide covers all 33 optional bundles exactly once across 19 journeys and keeps six distinct starter paths
  - the canonical SEIS-Agent MCP exposes a bounded local journey finder with at most three results, a 96-character query cap, no source-term return payload, no installation, and no external access
  - the canonical SEIS-Agent MCP reports the curated 34-card marketplace as ready and recommends at most one initial optional bundle without installation or external access
  - the terminal installer keeps its default plan to SEIS-Agent alone, accepts only one validated known journey for one initial optional bundle, and rejects bulk, arbitrary-bundle, duplicate-journey, and implicit-apply paths

definition_of_ready:
  - the canonical plugin-root repository and branch are known
  - the current marketplace transition is inventoried without reverting concurrent work
  - no destructive migration is required
  - the public and private permission boundary is understood

definition_of_done:
  - generated files are current on a focused branch
  - required validation and tests pass with exact evidence
  - security and rollback notes are current
  - documentation describes the implemented state rather than a future-only plan
  - GitHub publication remains approval-gated and is not claimed prematurely

