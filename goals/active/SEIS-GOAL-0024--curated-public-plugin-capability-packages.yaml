risks:
  - id: RISK-0024-001
    description: Concurrent generator edits could be overwritten or produce contradictory artifacts.
    likelihood: medium
    impact: high
    owner: lead-architect
    mitigation: Snapshot hashes before edits and regenerate only after the files are stable.
    trigger: A relevant source hash or modification time changes during inspection.
    contingency: Stop overlapping writes, preserve the incoming version, and rebase the focused patch.
    status: active
  - id: RISK-0024-002
    description: Consolidation could hide or lose source capability coverage.
    likelihood: low
    impact: high
    owner: testing-and-qa
    mitigation: Enforce exact-once coverage and retain all source directories.
    trigger: A missing, duplicate, or deleted member is detected.
    contingency: Reject generation and revert the marketplace projection.
    status: active
  - id: RISK-0024-003
    description: Generated MCP runtimes could accept unbounded input or unsafe file paths.
    likelihood: medium
    impact: high
    owner: security
    mitigation: Bound input, output, files, and requests; validate immutable profile fields; reject links; honor output backpressure; and keep network and writes disabled.
    trigger: A boundary test or security review fails.
    contingency: Keep bundles repository-local and remove them from the public projection by revert.
    status: active
  - id: RISK-0024-004
    description: A hostile concurrent filesystem actor could swap an ancestor after validation and before a later path operation.
    likelihood: low
    impact: high
    owner: security
    mitigation: Validate every ancestor, refuse links, open read targets with no-follow, revalidate output parents before atomic rename, and prohibit concurrent untrusted writers.
    trigger: An ancestor changes during generation or runtime metadata access.
    contingency: Stop the operation, discard repository-local output, verify the tree from a trusted checkout, and rerun validation.
    status: active
  - id: RISK-0024-005
    description: Historical direct-card snapshots could be mistaken for the current curated marketplace.
    likelihood: medium
    impact: high
    owner: documentation
    mitigation: Store historical counts in explicitly historical fields and require current v2 contracts to prove 10 cards, 30 internal packages, and 380 retained sources.
    trigger: A current validator derives marketplace readiness from a historical 377-to-381 card count.
    contingency: Reject the current projection, restore the last validated artifact, and migrate the consumer before regeneration.
    status: active
  - id: RISK-0024-006
    description: A bounded marketplace can still overwhelm users if the task-oriented general-plugin choice is unclear or a recommendation permits multi-plugin installation.
    likelihood: medium
    impact: medium
    owner: documentation
    mitigation: Keep SEIS-Agent as the canonical default, present ten task-oriented starter paths, cap the local deterministic finder at three candidates, recommend one general plugin only, and reject unknown or tampered guide data.
    trigger: A user-facing guide, MCP response, or manifest permits multiple automatic general-plugin selections or exposes internal packages as install cards.
    contingency: Revert the finder change, preserve the last validated 10-card projection, and restore the one-general-plugin-at-a-time workflow.
    status: active

rollback:
  strategy: revert
  steps:
    - revert the focused capability-package commit
    - restore the previous generated marketplace and family artifacts
    - keep every retained source package and the canonical SEIS-Agent package intact
  data_migration_required: false

github:
  issue_required: true
  branch_required: true
  commit_required: true
  pull_request_required: true
  release_note_required: false
  suggested_branch: plugins/seis-curated-capability-packages-v1
  suggested_commit: "feat(plugins): curate public capability packages"

observability:
