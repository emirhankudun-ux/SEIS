schema_version: 2

id: SEIS-GOAL-0024
project: seis
program: public-plugin-governance
initiative: capability-package-consolidation
parent_goal: SEIS-GOAL-021

title: Curate the SEIS public marketplace into bounded capability packages
summary: >-
  Replace hundreds of individual discovery cards with one canonical SEIS-Agent
  card inside a reviewed 30-to-50-card total marketplace surface, while retaining
  every public source package and preserving distinct SEIS, Eleni-Neferi, and
  Pantechnoesis capability boundaries.

