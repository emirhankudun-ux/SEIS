architecture_layers:
  - governance
  - integration
  - security

security_classification: public-safe
privacy_impact: none

requirements:
  - keep SEIS-Agent as the canonical default-install card among exactly ten general plugins
  - expose exactly ten public marketplace cards and zero internal-package cards
  - retain every application and topic source package without deletion
  - map every retained application and topic source package to exactly one of thirty internal packages
  - keep each internal package and every public manifest at no more than 15 capabilities
  - preserve dedicated SEIS, Eleni-Neferi, and Pantechnoesis topic boundaries
  - keep general-plugin runtimes local, read-only, bounded, and free of network or secret access
  - reject undeclared files, directories, links, and cross-family duplicate members
  - validate runtime profiles against immutable generated general-plugin and internal-package metadata
  - generate marketplace, package, and general-plugin artifacts from reviewed source data
  - generate ten task-oriented starter paths without adding internal-package marketplace cards
  - provide a local deterministic general-plugin finder that returns at most three candidates without installation or external access
  - recommend only one general plugin for a scoped task and fail closed on tampered metadata or unknown input
  - keep the terminal installer plan-only by default and require explicit --apply for one reviewed general-plugin installation
  - keep marketplace card counts separate from retained source capability counts in every current contract
  - preserve historical 34-card snapshots while excluding them from current v2 distribution proof

non_goals:
  - deleting or physically merging retained source packages
  - directly or bulk-installing internal packages or retained source members
  - publishing, pushing, signing, or deploying without current human approval
  - granting network, secret, cloud, GitHub-write, or destructive permissions
  - combining SEIS, Eleni-Neferi, and Pantechnoesis into one product identity

acceptance_criteria:
  - the generated marketplace contains exactly ten general cards, including one canonical SEIS-Agent card
  - all 75 application packages and all 300 topic packages are covered exactly once
  - exactly thirty internal packages each contain at least one and no more than 15 members
  - every general plugin owns exactly three internal packages and each internal package has one owner
  - category and project boundaries are explicit in package metadata
  - generated plugin manifests pass the repository validator
  - the general-plugin MCP input, output, metadata reads, and profile values are bounded and fail closed
  - generated internal-package and general-plugin trees contain exactly the allowlisted files and directories
  - source packages remain present and no source directory is deleted
  - focused generation, freshness, marketplace, integration, and test checks pass
  - current v2 contracts report 10 cards, 30 internal packages, and 380 retained source capabilities
  - the selection guide covers ten general plugins and keeps internal packages off the marketplace
  - the canonical SEIS-Agent MCP exposes a bounded local finder with at most three results, a 96-character query cap, no installation, and no external access
  - the terminal installer accepts one bounded local --find query, selects at most one general plugin, rejects direct internal-package targets, and never applies implicitly

definition_of_ready:
  - the canonical plugin-root repository and branch are known
  - the current marketplace transition is inventoried without reverting concurrent work
  - no destructive migration is required
  - the public and private permission boundary is understood

definition_of_done:
  - generated files are current on a focused branch
  - required validation and tests pass with exact evidence
  - security and rollback notes are current
  - documentation describes the implemented state rather than a future-only plan
  - GitHub publication remains approval-gated and is not claimed prematurely

