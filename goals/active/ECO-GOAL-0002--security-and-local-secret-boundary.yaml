    - docs/security/security-baseline.md
    - docs/security/hardening/hardening.json
    - scripts/check-security-boundary.mjs
    - scripts/test-security-boundary.mjs
    - https://github.com/emirhankudun-ux/SEIS/issues/129
    - https://github.com/emirhankudun-ux/SEIS/issues/178

