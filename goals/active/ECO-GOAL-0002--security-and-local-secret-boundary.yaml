risks:
  - id: ECO2-RISK-001
    description: The historical generated aggregate allowlist may conceal a prior credential exposure.
    likelihood: medium
    impact: critical
    owner: project-owner
    mitigation: Keep issue 129 open and visible; never inspect values in public output; require revocation and rotation decisions before any history action.
    trigger: The allowlist is removed, expanded, or described as resolved without owner evidence.
    contingency: Block completion and publication claims, preserve the repository, and follow the credential incident-response runbook.
    status: open
  - id: ECO2-RISK-002
    description: Scanner download tampering could turn a security workflow into a supply-chain execution path.
    likelihood: low
    impact: high
    owner: devops
    mitigation: Pin the archive version and verify its official SHA-256 checksum before extraction or execution.
    trigger: The downloaded archive checksum differs from the reviewed release checksum.
    contingency: Fail the workflow before extraction, retain logs without payload contents, and review the official release source.
    status: open
  - id: ECO2-RISK-003
    description: Boundary validators could disclose a secret-like fixture value in their failure output.
    likelihood: low
    impact: high
    owner: testing
    mitigation: Report variable names and control categories only; negative tests assert the fixture value never appears in output.
    trigger: A test or CI log includes the secret-like fixture value.
    contingency: Stop the check, redact logs, rotate if exposure is plausible, and add a regression fixture before resuming.
    status: open

rollback:
  strategy: revert
  steps:
    - Revert the focused security-boundary commits without changing credentials or repository history.
    - Restore the previous tracked policies, workflow, scanner script, and ignore behavior.
    - Keep issue 129 and any credential incident open until owner-authorized closure.
  data_migration_required: false

github:
