schema_version: 2

id: ECO-GOAL-0002
project: ecosystem
program: security
initiative: local-secret-boundary
parent_goal: null

title: Establish the security and local-secret boundary
summary: >-
  Make SEIS secret storage, public/private classification, credential incident
  response, local scanning, and CI enforcement explicit, deterministic,
  fail-closed, and safe for a public repository without reading secret values.

category:
  - security
  - privacy
  - devsecops
  - incident-response
  - repository-hygiene

priority: critical
status: review
maturity: prototype
confidence: medium

owner_agent: security
accountable_human: project-owner
supporting_agents:
  - devops
  - repository-hygiene
  - documentation
  - testing

horizon: now
start_after: null
target_window:
  start: '2026-07-13'
  end: null

scope:
  repositories:
    - seis
  paths:
    - .gitignore
    - .env.example
    - .gitleaks.toml
    - SECURITY.md
    - docs/SECURITY.md
    - docs/PUBLIC_PRIVATE_BOUNDARY.md
    - docs/security
    - scripts/check-security-boundary.mjs
    - scripts/test-security-boundary.mjs
    - scripts/check-seis-enterprise-gates.mjs
    - scripts/security/scan-secrets.sh
    - .github/workflows/security-guardian.yml
    - .github/workflows/foundation-check.yml
    - package.json

canonical_owner_repo: seis

platforms:
  - repository
  - github
  - ci

architecture_layers:
  - security
  - governance
  - integration

security_classification: public-safe
privacy_impact: low

requirements:
  - Secret-bearing files and local-private directories remain ignored while security controls and workflows remain visible to Git.
  - The environment template contains placeholders only for secret-like variables.
  - Approved secret stores, ownership, access, revocation, rotation, and redaction rules are documented.
  - Credential exposure has a non-destructive incident runbook with explicit approval gates for history changes.
  - Local Gitleaks execution is redacted, fail-closed, and never installs software automatically.
  - CI verifies the pinned scanner archive checksum, runs redacted history scanning, and fails on high dependency vulnerabilities.
  - The canonical npm lockfile remains visible to Git, lifecycle scripts stay disabled during CI install, and checkout credentials are not persisted.
  - The known historical allowlist remains visible and cannot be treated as resolved without owner action on issue 129.

non_goals:
  - Reading, printing, copying, or rotating any credential.
  - Removing or expanding the historical Gitleaks allowlist without owner approval.
  - Rewriting Git history, force-pushing, or resolving GitHub issue 129.
  - Enabling live providers, SSH, deployment, or external write access.
  - Merging this stacked branch before ECO-GOAL-0003 is merged.

acceptance_criteria:
  - Deterministic validation rejects unsafe ignore rules, non-placeholder secret variables, missing incident steps, implicit workflow permissions, and non-redacted scanner invocation.
  - Negative fixtures prove failures without echoing the secret-like fixture value.
  - The local scanner exits safely with setup guidance when Gitleaks is unavailable.
  - The Guardian workflow uses explicit contents-read permission and checksum-verifies Gitleaks 8.30.1 before execution.
  - Dependency audit no longer suppresses high-severity failures.
  - CI regression checks reject ignored lockfiles, persisted checkout credentials, or lifecycle-script-enabled dependency installation.
  - Security policy, storage policy, incident response, public/private boundary, and current baseline link to one another.
  - Local and pull-request validation evidence is recorded.

definition_of_ready:
  - ECO-GOAL-0003 validator foundation is available on the stacked base branch.
  - The SEIS project manifest classifies the repository as public-safe with local-or-managed-only secrets.
  - Existing scanner, workflow, policies, and ignore rules have been audited without exposing values.
  - No credential rotation or destructive history operation is required for the implementation slice.

definition_of_done:
  - Focused security controls, documentation, validators, and tests are committed on the non-default branch.
  - Required local and remote checks pass with exact evidence.
  - Issue, branch, commit, pull request, risk, rollback, and blocked historical findings are recorded consistently.
  - Required quality gates pass or are explicitly not applicable.
  - The historical allowlist is either resolved through owner-authorized incident handling or accepted with documented residual risk.

dependencies:
  - ECO-GOAL-0003

blocked_by:
  - type: approval
    reference: github-issue-129
    reason: A historical generated aggregate remains path-allowlisted from Gitleaks and must be treated as sensitive until the owner decides remediation or documented acceptance.
    unblock_condition: Issue 129 records owner-authorized remediation with rotation and history decisions, or explicit residual-risk acceptance supported by evidence.

related_goals:
  - ECO-GOAL-0001
  - ECO-GOAL-0003

