canonical_owner_repo: SEIS-plugin-root-20260715

platforms:
  - repository
  - cli
  - codex-plugin

architecture_layers:
  - governance
  - automation
  - integration

security_classification: public-safe
privacy_impact: none

requirements:
  - mirror exactly five planned 30-step rounds with 150 total checkpoints and an explicit external evidence authority
  - define five evidence-led 100-step waves that remain gated until the five initial rounds have reproducible completion evidence and retain a ten-year strategic horizon
  - increase the next five-wave series to 200 steps per wave after the current series closes
  - define a machine-validated five-wave escalation ladder from 200 through 600 steps per wave across the ten-year horizon
  - keep escalation-step counts separate from the 10-card public marketplace projection, 30 internal packages, and 15-capability limit
  - retain Round 11 only as a gated 200-step compatibility template with no active or completed steps
  - execute plan, generation, and validation only during a foreground local invocation
  - allowlist exactly 27 current-v2 local generator, validation, test, and diff-check phases explicitly
  - map every reviewed phase exactly once to one named automation role and report that role lane without parallel or background execution
  - anchor repository identity and phase targets independently of the caller working directory
  - refuse linked or replaced phase targets and revalidate device, inode, size, and digest immediately before execution
  - disclose that the reviewed allowlist is source containment rather than an operating-system sandbox
  - keep all external writes, network access, secrets, provider calls, deployment, release, GitHub push, merge, and destructive work disabled
  - report a clear approval-gated GitHub delivery next action
  - preserve the canonical SEIS-Agent default installation and curated general-plugin/internal-package boundaries

non_goals:
  - background agents continuing after the command exits
  - autonomous commits, pushes, merges, releases, deployments, or installations
  - self-granted credentials, provider access, network access, or secret access
  - changing the current curated marketplace algorithm without a separate goal
  - deleting source packages or bundle members

acceptance_criteria:
  - a generated ten-year autopilot program is current and validates its inputs
  - downstream evidence snapshots are refreshed when the continuity record changes size
  - a plan mode reports the next safe phases without writing generated artifacts
  - an apply-safe mode runs only allowlisted local generators and validators
  - the automation has no GitHub push or external command path
  - the five planned 30-step rounds, external execution-ledger boundary, gated first 100-step wave, and gated 200-step transition are machine-validated
  - the 200, 300, 400, 500, and 600-step five-wave tiers are machine-validated with no active cycle or self-granted authority
  - Round 11 remains a 200-step compatibility template in ten 20-step rounds with all steps gated
  - all 27 phase targets are repository-anchored; executable targets are regular, link-free, bounded, hashed, and checked again before spawn
  - plan and apply-safe reports expose validated foreground-sequential role lanes for all six named automation roles
  - plan mode succeeds from a foreign working directory and a linked phase-target fixture is rejected
  - failures are reported without a success claim
  - documentation states that the command is supervised foreground automation, not persistent autonomous execution

definition_of_ready:
  - curated marketplace goal and current bundle artifacts are present
  - public/private boundary is known
  - the current branch is known
  - no destructive migration or external permission is required

definition_of_done:
  - focused generator, runner, docs, and tests are committed on a feature branch
  - local plan and apply-safe validation pass
  - the public/private boundary and rollback are documented
  - all external delivery actions remain approval-gated

dependencies:
  - SEIS-GOAL-0024
blocked_by: []
related_goals:
  - SEIS-GOAL-0024

validation:
  commands:
    - npm run check:seis-public-plugin-supervised-autopilot
    - npm run seis:public-plugin-autopilot -- --plan
    - npm run seis:public-plugin-autopilot -- --apply-safe
    - node --test plugins/seis-core/test/public-plugin-supervised-autopilot.test.mjs
    - git diff --check
  manual:
    - automation permission-boundary review
    - long-horizon roadmap review
  evidence:
    - generated supervised autopilot program
    - foreground plan/build/validation output

quality_gates:
  architecture: required
  design: not-applicable
  security: required
  accessibility: not-applicable
  performance: required
  documentation: required
  testing: required

risks:
  - id: RISK-0025-001
    description: An automation label could be mistaken for persistent autonomous execution.
    likelihood: medium
    impact: high
    owner: lead-architect
    mitigation: Foreground-only execution, explicit no-background fields, and a command allowlist.
    trigger: A script adds persistence, daemon, scheduled, or network behavior.
    contingency: Disable apply-safe mode and revert the runner.
    status: active
  - id: RISK-0025-002
    description: A plan-and-build runner could accidentally expand into external GitHub delivery.
    likelihood: low
    impact: high
    owner: security
    mitigation: No git push, gh, network, shell, or arbitrary command inputs in the runner.
    trigger: An external delivery command is introduced or invoked.
    contingency: Revert the runner and require a separate approved delivery action.
    status: active
  - id: RISK-0025-003
    description: Long-horizon planning could be presented as completed future work.
    likelihood: medium
    impact: medium
    owner: documentation
    mitigation: Mark every future phase strategic, gated, and non-automatic.
    trigger: Documentation claims a future phase executed.
    contingency: Correct the record and add a review gate.
    status: active
  - id: RISK-0025-004
    description: A reviewed command allowlist could be mistaken for operating-system sandboxing.
    likelihood: medium
    impact: high
    owner: security
    mitigation: Report reviewed-allowlist-no-os-sandbox, keep ambient network and filesystem isolation claims false, and document that hostile descendant termination is not guaranteed.
    trigger: Output or documentation claims kernel-enforced network, filesystem, or descendant isolation.
    contingency: Disable apply-safe mode, correct the claims, and require a real sandbox design before re-enabling execution.
    status: active
  - id: RISK-0025-005
    description: A phase file or ancestor could change after validation and before process execution.
    likelihood: low
    impact: high
    owner: security
    mitigation: Reject links, snapshot device, inode, size, and digest, then revalidate immediately before spawning the absolute target path.
    trigger: Any target identity or digest changes between inspection and execution.
    contingency: Abort the run, trust no partial success, inspect the checkout, and rerun from a stable local tree.
    status: active

rollback:
  strategy: revert
  steps:
    - revert the focused supervised-autopilot commit
    - remove the package scripts introduced by the goal
    - retain curated marketplace and retained source packages unchanged
  data_migration_required: false

github:
  issue_required: true
  branch_required: true
  commit_required: true
  pull_request_required: true
  release_note_required: false
  suggested_branch: automation/seis-public-plugin-supervised-autopilot
  suggested_commit: "feat(automation): add supervised public plugin autopilot"

observability:
  metrics:
    - autopilot_plan_success
    - autopilot_apply_safe_success
    - autopilot_blocked_external_action_count
    - public_marketplace_card_count
  logs: []

outputs:
  - supervised foreground plan-and-build runner
  - five-round 150-checkpoint immediate execution map
  - five-wave and ten-year strategic program
  - gated five-wave escalation ladder that does not expand marketplace-card count
  - permission-boundary documentation
  - tests and validation commands

notes:
  - The earlier 48-phase allowlist contained legacy 34-card and Wave 4/5 generators; it was replaced with 27 current-v2 phases. It validates current v2 artifacts but does not itself close Goal 0029 cadence rounds.
  - Round 11 is a compatibility template only and cannot activate before all five current 100-step waves close with evidence.
  - The ten-year horizon is strategic planning only; it never implies hidden or continuous execution.
  - GitHub delivery remains a separate current-approval and environment-availability decision.
