schema_version: 2

id: SEIS-GOAL-0025
project: seis-plugin-root
program: public-plugin-governance
initiative: supervised-long-horizon-automation
parent_goal: SEIS-GOAL-0024

title: Add a supervised plan-and-build autopilot for public SEIS plugin packages
summary: >-
  Provide a deterministic local command that plans, regenerates, and validates
  the curated public plugin marketplace during one foreground invocation,
  mirroring the canonical five planned 30-step rounds whose real completion is
  recorded only by the Goal 0029 execution ledger. Define a ten-year, five-wave
  escalation ladder from 200 through 600 steps per wave without activating the
  first 100-step or 200-step series before prerequisite reproducible completion
  evidence exists. It must not claim legacy Wave 5 steps completed, background
  execution, or self-authorize GitHub,
  release, provider, credential, network, destructive, or write actions.

category:
  - plugins
  - automation
  - architecture
  - documentation
  - testing
  - security

priority: high
status: review
maturity: prototype
confidence: medium

owner_agent: lead-architect
accountable_human: project-owner
supporting_agents:
  - automation
  - testing-and-qa
  - security
  - documentation

horizon: 10-years-strategic
start_after: null
target_window:
  start: 2026-07-22
  end: null

scope:
  repositories:
    - SEIS-plugin-root-20260715
  paths:
    - goals/active/SEIS-GOAL-0025--supervised-public-plugin-autopilot.yaml
    - content/development/seis-public-plugin-supervised-autopilot.json
    - docs/roadmap/SEIS_PUBLIC_PLUGIN_SUPERVISED_AUTOPILOT.md
    - scripts/create-seis-public-plugin-supervised-autopilot.mjs
    - scripts/run-seis-public-plugin-supervised-autopilot.mjs
    - scripts/create-seis-public-plugin-continuity-cadence.mjs
    - scripts/check-seis-public-plugin-expansion-program.mjs
    - content/development/seis-public-plugin-continuity-cadence.json
    - content/development/seis-public-plugin-wave-4-closeout.json
    - content/development/seis-public-plugin-wave-4-evidence-retention.json
    - docs/roadmap/SEIS_PUBLIC_PLUGIN_CONTINUITY_CADENCE.md
    - plugins/seis-core/test/public-plugin-continuity-cadence.test.mjs
    - plugins/seis-core/test/public-plugin-supervised-autopilot.test.mjs
