title: Establish Goal schema validation and CI enforcement
summary: >-
  Make ecosystem Goal YAML, project manifests, repository ownership, lifecycle
  rules, evidence, and GitHub handoff fields deterministically validatable in a
  least-privilege pull-request gate.

