risks:
  - id: ECO3-RISK-001
    description: A permissive partial JSON Schema implementation may accept unsupported schema keywords silently.
    likelihood: medium
    impact: high
    owner: testing
    mitigation: Pair structural validation with explicit semantic checks and negative fixtures for every enforced invariant.
    trigger: A malformed fixture exits successfully.
    contingency: Keep the goal in progress, add the missing semantic rule, and add a regression fixture.
    status: open
  - id: ECO3-RISK-002
    description: CI integration may appear complete before a remote pull-request run supplies evidence.
    likelihood: medium
    impact: medium
    owner: devops
    mitigation: Distinguish local workflow validation from remote GitHub Actions evidence.
    trigger: Documentation says CI passed without a checks URL.
    contingency: Retain required gates and CI evidence as pending until the remote run exists.
    status: closed

rollback:
  strategy: revert
  steps:
    - Revert the focused schema, validator, fixture, workflow, and template commit.
    - Restore ECO-GOAL-0001 validation to the last passing bootstrap contract.
  data_migration_required: false

github:
  issue_required: true
  branch_required: true
  commit_required: true
  pull_request_required: true
  release_note_required: false
  suggested_branch: architecture/ecosystem-goal-tracking-v1
  suggested_commit: 'test(governance): enforce ecosystem goal validation in ci'
  issue_url: https://github.com/emirhankudun-ux/SEIS/issues/176
  branch_name: architecture/ecosystem-goal-tracking-v1
  commit_sha: null
  pull_request_url: https://github.com/emirhankudun-ux/SEIS/pull/177
  release_note_url: null

