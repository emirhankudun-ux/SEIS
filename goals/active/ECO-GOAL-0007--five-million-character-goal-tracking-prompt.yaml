risks:
  - id: ECO7-RISK-001
    description: A five-megacharacter tracked artifact would create a review-hostile repository diff and encourage source duplication.
    likelihood: high
    impact: high
    owner: repository-hygiene
    mitigation: Commit only modular sources, compiler, tests, and golden hashes; write the generated corpus only below ignored build/.
    trigger: Git status shows the generated prompt or chunks as trackable files.
    contingency: Stop, remove the generated files from the index without deleting user work, and tighten the exact ignore contract.
    status: closed
  - id: ECO7-RISK-002
    description: Exact length could be reached with meaningless padding, repeated paragraphs, or destructive truncation.
    likelihood: medium
    impact: high
    owner: prompt-engineering
    mitigation: Use unique scenario blocks plus a fail-closed semantic exact-fit solver and adversarial anti-padding checks.
    trigger: Duplicate semantic IDs, duplicate long paragraphs, whitespace padding, repeated-character runs, or a partial final instruction are detected.
    contingency: Fail the build and revise source dimensions or semantic micro-directives; never fall back to filler.
    status: closed
  - id: ECO7-RISK-003
    description: Operators may mistake five million characters for a supported single-request provider context.
    likelihood: high
    impact: medium
    owner: documentation
    mitigation: Label the output as a corpus, emit bounded contextual chunks, and make no token or provider-capacity claim.
    trigger: Documentation or output calls the full corpus directly consumable by one model request.
    contingency: Block review and correct the contract before publication.
    status: mitigated
  - id: ECO7-RISK-004
    description: Source expansion could accidentally include credentials, private paths, or lower-authority prompt injection.
    likelihood: medium
    impact: critical
    owner: security
    mitigation: Use an exact tracked-file allowlist, public-safe scanner, authority router, and redacted error messages.
    trigger: A source is untracked, symlinked, outside the repository, secret-like, private-path-bearing, or contains unsafe controls.
    contingency: Fail closed, disclose only the path and rule identifier, and require private provenance review before any exception.
    status: mitigated
  - id: ECO7-RISK-005
    description: GitHub accepted the new feature branch through administrator bypass while the inherited history contains a merge commit and the substantive commit lacks a verified signature.
    likelihood: high
    impact: high
    owner: devops
    mitigation: Keep the pull request in draft, disclose the bypass, prohibit merge, and require repository-owner review of a policy-compliant signed history strategy.
    trigger: The push response reports branch-creation, merge-commit, or signature rule violations.
    contingency: Recreate or rebase the branch through the approved signed workflow only after explicit owner direction; do not force-push or rewrite history autonomously.
    status: open

rollback:
  strategy: revert
