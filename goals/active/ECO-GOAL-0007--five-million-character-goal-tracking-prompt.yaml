requirements:
  - Compile only reviewed, versioned, public-safe source modules without third-party dependencies.
  - Define character as a Unicode code point after NFC and LF newline normalization.
  - Produce exactly 5,000,000 code points and record UTF-8 bytes, UTF-16 code units, lines, chunks, and SHA-256 digests separately.
  - Cover authority, repository inspection, Goal selection, lifecycle, evidence, dependencies, risk, rollback, GitHub mapping, blockers, completion audit, and final reporting.
  - Give every generated scenario and exact-fit directive a deterministic unique identifier and semantic purpose.
  - Reject unsafe source paths, untracked files, symlinks, configured prohibited secret-like patterns, private paths, hidden controls, CRLF drift, arbitrary padding, and truncation.

non_goals:
  - Replacing AGENTS.md or any canonical Goal record with the generated corpus.
  - Executing the five-year roadmap or claiming hidden background execution.
  - Claiming five million characters equals five million tokens or one provider-compatible context window.
  - Connecting providers, importing private repositories, using SSH, deploying, merging, or writing to the protected default branch.
  - Copying private chain-of-thought, private memory, credentials, or proprietary system prompts.

acceptance_criteria:
  - A local ignored artifact contains exactly 5,000,000 normalized Unicode code points and one final LF.
  - Two clean in-memory compiler runs are byte-identical and match the committed golden SHA-256 contract.
  - Payload chunks reconstruct the canonical prompt byte-for-byte and contextual chunks identify their partial-corpus boundary.
  - The checker rejects one-character size drift, output tampering, manifest drift, duplicate semantic identifiers, unsafe sources, CRLF, NUL, and prohibited secret patterns.
  - No filler-only section, whitespace padding, repeated-character padding, or mid-sentence truncation is used to hit the target.
  - Ecosystem foundation, legacy Goal Tracking, Master Prompt compatibility, prompt-pack tests, and diff checks pass.

definition_of_ready:
  - Root AGENTS.md and project.ecosystem.yaml have been read.
  - Existing prompt and Goal systems have been inventoried and their boundaries documented.
  - A non-default stacked branch and clean worktree exist.
  - The output directory is already ignored and no live provider is required.

definition_of_done:
  - Prompt sources, schema, compiler, checker, tests, golden contract, documentation, and Goal evidence are committed on the focused branch.
  - Exact character count, deterministic hashes, semantic coverage, source policy, chunks, and tamper rejection are reproducibly validated.
  - Required quality gates have evidence and failed or skipped checks remain visible.
  - A focused issue and stacked pull request document risks, rollback, generated-output policy, and the parent branch.

